<style>
*{box-sizing:border-box}
body{margin:0}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

.nb{font:500 12.5px/1 var(--font-sans);color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:7px 11px;cursor:pointer}

 --ready:#6fcf8e;--working:#8ab4f8;--attention:#f2c14e;--problem:#f26b5b;--unknown:#8a8882;
 --glow:0 0 0 3px color-mix(in srgb,currentColor 16%,transparent),0 0 10px currentColor;
 background:var(--bg);color:var(--ink);font:400 15px/1.5 'Archivo',system-ui,sans-serif;border-radius:var(--radius);padding:18px 20px 0;overflow:hidden}

b{font-weight:600}
.head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}

ol.plain{margin:0;padding-left:20px;display:grid;gap:8px;font-size:13.5px;line-height:1.45}
ol.plain li::marker{color:var(--accent);font-family:'JetBrains Mono';font-size:12px}
.drop{display:flex;align-items:center;gap:16px;border:1.5px dashed color-mix(in srgb,var(--ink) 28%,transparent);border-radius:6px;padding:20px;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.drop svg{width:34px;height:34px;color:var(--accent);flex:0 0 auto}

.steps li>div span,.ladder li>div span{display:block;font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}

.listhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.search svg{width:16px;height:16px}
.filters{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap}
.filters span{font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:5px;border:1px solid var(--line)}
.filters span.on{color:var(--ink);background:var(--raised);border-color:var(--raised)}
.rows{display:grid;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:34px 1fr 178px 70px 14px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:default}
.row:first-child{border-top:0}
.row[data-go]{cursor:pointer}.row[data-go]:hover{background:var(--raised)}
.ri{width:34px;height:34px;border-radius:5px;background:var(--raised);display:grid;place-items:center}

.row b{display:block;font-size:14.5px}

.row .chip{justify-self:start}
.row .chev{color:var(--faint);width:14px;height:14px}
.impact{list-style:none;margin:0;padding:0}
.impact li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.impact li:first-child{border-top:0;padding-top:0}
.impact b{font-size:14px}.impact span{grid-column:1;font-size:13px;color:var(--muted);line-height:1.45}
.tag{grid-row:1;grid-column:2;font:600 9.5px/1 'Archivo';font-stretch:125%;text-transform:uppercase;letter-spacing:.12em;padding:5px 7px;border-radius:4px;border:1px solid color-mix(in srgb,var(--ink) 45%,transparent);color:var(--ink);align-self:start}
.tag.dim{border-color:var(--line);color:var(--faint)}
.callout{margin-top:14px;padding:12px 14px;border-radius:6px;background:var(--raised);font-size:13.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.callout svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px;color:var(--muted)}
.path{display:flex;align-items:flex-start;padding:14px 0 2px}
.node{flex:0 0 auto;width:clamp(64px,15vw,112px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px}
.node .nd{width:14px;height:14px;border-radius:50%;background:var(--c);color:var(--c);box-shadow:var(--glow)}
.node .nl{font:600 13px/1.2 'Archivo'}
.node .ns{font-size:11.5px;color:var(--muted);line-height:1.25}
.node.ok{--c:var(--ready)}.node.bad{--c:var(--problem)}
.node.off .nd{background:transparent;border:2px solid var(--faint);box-shadow:none}
.node.off .nl{color:var(--muted)}
.wire{flex:1 1 auto;min-width:12px;position:relative;height:2px;margin-top:6px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.wire.cut{background:repeating-linear-gradient(90deg,var(--problem) 0 6px,transparent 6px 11px)}
.wire.dim{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.pulse{position:absolute;top:50%;left:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ready);box-shadow:0 0 8px var(--ready);animation:flow 1.8s linear infinite}
.wire:nth-of-type(2) .pulse{animation-delay:-.6s}.wire:nth-of-type(3) .pulse{animation-delay:-1.2s}
@keyframes flow{0%{left:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:100%;opacity:0}}
.fix{list-style:none;margin:0;padding:0}
.fix li{display:grid;grid-template-columns:30px 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fix li:first-child{border-top:0;padding-top:2px}
.fix .n{font:500 12px/1 'JetBrains Mono';color:var(--accent);align-self:start;margin-top:4px}
.fix b{font-size:14px;display:block}.fix span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.fix li.off b{color:var(--muted)}.fix li.off .n{color:var(--faint)}
.fix .btn{height:38px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:default}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
.choice.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);margin-top:3px;display:grid;place-items:center}
.choice.sel .rd{border-color:var(--ink)}.choice.sel .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.choice .top{display:flex;gap:10px;align-items:center}.choice b{font-size:15px}
.choice span{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.choice small{display:block;font:12px/1.5 'JetBrains Mono';color:var(--faint);margin-top:6px}
.choice .tag{grid-row:auto;grid-column:auto}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px}
.sw b{font-size:14px;display:block}.sw span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.tg{flex:0 0 auto;width:42px;height:24px;border-radius:12px;background:var(--raised);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .12s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .12s,background .12s}
.tg.on{background:var(--ink);border-color:var(--ink)}.tg.on::after{transform:translateX(18px);background:var(--bg)}
.loc{display:grid;grid-template-columns:40px 1fr 150px;gap:4px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.loc:first-of-type{border-top:0;padding-top:2px}
.drv{font:500 13px/1 'JetBrains Mono';border:1px solid var(--line);border-radius:5px;height:32px;display:grid;place-items:center;background:var(--raised)}
.loc b{font-size:14px;display:block}.loc small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.bar2{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}.bar2 i{display:block;height:100%;background:color-mix(in srgb,var(--ink) 55%,transparent)}
.loc .mono{display:block;font-size:11.5px;color:var(--muted);margin-top:5px;text-align:right}
.lib{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.lib:first-of-type{border-top:0;padding-top:0}.lib .mono{color:var(--muted);font-size:12px}
.lib .btn{height:34px;padding:0 12px;font-size:12.5px}
ul.opts{list-style:none;margin:0;padding:0;display:grid;gap:14px}
ul.opts li{display:grid;gap:6px}
ul.opts .btn{justify-self:start}
ul.opts span{font-size:12.5px;color:var(--muted);line-height:1.45}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.alert{border-left:3px solid var(--problem);background:color-mix(in srgb,var(--problem) 7%,var(--panel));border-radius:6px;padding:15px 16px;margin-top:14px}
.alert h4{margin:0 0 4px;font:600 16px/1.3 'Archivo'}
.alert p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.alert .actions{margin-top:12px}
details{margin-top:12px;font-size:13px;color:var(--muted)}
summary{cursor:pointer;color:var(--muted);list-style:none;display:inline-flex;gap:6px;align-items:center}
summary::before{content:"›";display:inline-block;transition:transform .12s;color:var(--faint)}
details[open] summary::before{transform:rotate(90deg)}
details p{margin:8px 0 0;padding:10px 12px;border-radius:5px;background:var(--bg);border:1px solid var(--line);line-height:1.55}
textarea{width:100%;min-height:64px;resize:vertical;margin-top:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:10px 12px;font:14px/1.45 'Archivo'}
textarea::placeholder{color:var(--faint)}
.file{display:flex;align-items:center;gap:12px}
.file svg{width:30px;height:30px;color:var(--accent);flex:0 0 auto}
.file small{display:block;font-size:12.5px;color:var(--muted)}
@media (max-width:600px){
 nav{display:none}
 .cols,.cols.w,.three{grid-template-columns:1fr}
 .row{grid-template-columns:34px 1fr 14px}.row .chip,.row .mono{display:none}
 .node .ns{display:none}.node .nl{font-size:11.5px}
 .drop{flex-wrap:wrap}
 .loc{grid-template-columns:40px 1fr}.loc>div:last-child{grid-column:2}
}
@media (prefers-reduced-motion:reduce){.pulse,.s-working .dot,.steps .now i{animation:none}.pulse{left:50%}.body>*{animation:none}}
</style></head>
<body>
<div class="ctl" id="tabs"></div>
<div class="stepbar"><span class="q" id="q"></span><button class="nb" id="back">Back</button><button class="nb" id="next">Next</button></div>
<div class="app">
 <div class="bar">
  <span class="brand"><svg class="mk i" viewBox="0 0 32 32" style="stroke-width:2"><path d="M2 23h28"/><path d="M7 26V6M25 26V6"/><path d="M2 23L7 6Q16 19 25 6L30 23"/><path d="M11.5 10.9V23M16 12.5V23M20.5 10.9V23"/></svg><span class="pname">Linux Plugin Bridge</span></span>
  <nav id="nav"><a>Home</a><a>Plug-ins</a><a>Activity</a><a>Support</a></nav>
  <span class="chip s-ready" style="font-size:12px;padding:5px 10px 5px 8px"><i class="dot"></i>Manager running</span>
 </div>
 <div class="body" id="body"></div>
</div>
<script>
const I={
 plugin:'<svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="11" r="3.5"/><path d="M12 11V7.6M8.5 17h7"/></svg>',
 install:'<svg class="i" viewBox="0 0 24 24"><path d="M12 4v10M8 10.5l4 4 4-4"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>',
 update:'<svg class="i" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4.5V8h-3.5"/></svg>',
 report:'<svg class="i" viewBox="0 0 24 24"><path d="M6.5 3.5H14l4 4v13H6.5z"/><path d="M14 3.5v4h4M9.5 12.5h5M9.5 15.5h5M9.5 18.2h3"/></svg>',
 check:'<svg class="i" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>',
 no:'<svg class="i" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
 search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
 chev:'<svg class="i chev" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5"/></svg>',
 setup:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5L12 12l8-4.5M12 12v9"/></svg>',
 info:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>'
};
const chip=(k,b,s)=>`<span class="chip s-${k}"><i class="dot"></i><b>${b}</b>${s?`<span>${s}</span>`:''}</span>`;
const head=(icon,lbl,title,meta,c,m)=>`<div class="head"><div class="picon">${I[icon]}</div><div class="hmain"><div class="lbl">${lbl}</div><div class="title${m?' m':''}">${title}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>${c||''}</div>`;
const N=[['Bitwig Studio','your DAW'],['Bridge plug-in','native Linux'],['Windows host','managed for you'],['Kontakt 8','Windows plug-in']];
const path=(nodes,wires,subs)=>'<div class="path">'+nodes.map((s,i)=>`<div class="node ${s}"><i class="nd"></i><span class="nl">${N[i][0]}</span><span class="ns">${subs?subs[i]:N[i][1]}</span></div>`+(i<3?`<div class="wire ${wires[i]==='live'?'':wires[i]}">${wires[i]==='live'?'<i class="pulse"></i>':''}</div>`:'')).join('')+'</div>';
const livePath=`<div class="panel mt"><div class="prow"><span class="lbl">Signal path</span><span class="mono" style="color:var(--muted)">48 kHz · 256 · audio flowing</span></div>${path(['ok','ok','ok','ok'],['live','live','live'])}</div>`;

install:{name:'Install a plug-in',steps:[

<p class="lead">Choose a Windows installer you downloaded from the plug-in maker. The manager runs it in a managed Windows setup and gives your DAW a native Linux plug-in to load.</p>
<div class="drop">${I.install}<div><b>Drop an installer here</b><span>An .exe or .msi from the maker's website</span></div><button class="btn primary" data-go="install:1">Choose installer…</button></div>
<div class="three">
 <div class="panel"><span class="num">01</span><b>Install</b><p>The maker's installer runs in a setup of its own, away from the rest of your system.</p></div>
 <div class="panel"><span class="num">02</span><b>Publish</b><p>Your DAW finds a native plug-in in <span class="mono">~/.vst3</span>.</p></div>
 <div class="panel"><span class="num">03</span><b>Play</b><p>Load it like any other plug-in. Projects save and reopen as normal.</p></div>
</div>`},

<div class="cols">

 <div class="panel"><div class="lbl">What stays as it is</div><ul class="chg">

</div>
<div class="actions"><button class="btn primary" data-go="install:2">Install</button><button class="btn secondary" data-go="install:0">Choose a different file</button></div>`},

<div class="panel"><ol class="steps">

]},

fix:{name:'Fix a problem',steps:[
{nav:'Plug-ins',q:'When the editor fails, can you see what still works and how to fix it?',html:`
${head('plugin','Plug-in','Ozone 11','iZotope · VST3 effect · 11.0.3',chip('problem','Editor didn’t open'))}
<div class="cols w">
 <div class="panel"><div class="lbl">Is it ready?</div><ul class="ladder">
  ${lad('ok','Installed','In the iZotope setup, with iZotope Product Portal','')}
  ${lad('ok','In your DAW’s folder','<span class="mono">~/.vst3/iZotope Ozone 11.vst3</span>','')}
  ${lad('ok','Sound','Processes audio in Bitwig Studio','19 Oct')}
  ${lad('bad','Editor window','Stayed blank when you opened it in Bitwig Studio','19 Oct')}</ul></div>
 <div class="panel"><div class="lbl">What you can do</div><ul class="opts">
  <li><button class="btn primary" data-go="fix:1">Fix it step by step</button><span>The manager tries one safe change at a time and undoes anything that doesn’t help.</span></li>
  <li><button class="btn secondary" data-go="fix:2">Open Ozone on its own</button><span>See its window outside Bitwig.</span></li>
  <li><button class="btn secondary">Use it without its window</button><span>Keep it for sound and automation.</span></li></ul></div>
</div>
<p class="note">Sound keeps working meanwhile, and Bitwig can automate Ozone’s controls without its window.</p>`},
{nav:'Plug-ins',q:'Is it clear what each fix does, which order to try them in, and that each can be undone?',html:`
${head('plugin','Fix it','Ozone 11’s editor window','One change at a time. Anything that doesn’t help is undone.',chip('problem','Editor didn’t open'))}
<div class="panel"><ul class="fix">
 <li><span class="n">01</span><div><b>Open Ozone on its own</b><span>Shows whether Ozone can draw its window at all, away from Bitwig.</span></div><button class="btn secondary" data-go="fix:2">Open</button></li>
 <li><span class="n">02</span><div><b>Choose another display mode</b><span>Draws the window a different way. Only Ozone changes.</span></div><button class="btn secondary" data-go="fix:3">Choose…</button></li>
 <li><span class="n">03</span><div><b>Turn off Windows accessibility support for Ozone</b><span>Some plug-in windows hang while it runs.</span></div><button class="btn secondary">Turn off</button></li>
 <li><span class="n">04</span><div><b>Repair Ozone’s installation</b><span>Runs the iZotope installer again in its setup. Your presets stay.</span></div><button class="btn secondary">Repair</button></li>
 <li class="off"><span class="n">05</span><div><b>Go back to a version that worked</b><span>Not available: Ozone hasn’t worked on this computer yet.</span></div><button class="btn secondary" disabled>Go back</button></li>
</ul></div>
<div class="actions"><button class="btn secondary">Send a report with what you tried</button><button class="btn quiet" data-go="fix:0">Back</button></div>`},
{nav:'Plug-ins',q:'Opening it outside the DAW: does it help you tell where the problem is?',html:`
${head('plugin','Open on its own','Ozone 11','Running by itself in the iZotope setup, outside Bitwig',chip('attention','Needs you','look at its window'))}
<div class="panel"><ol class="steps">
 ${lad('done','Opened Ozone by itself','Its window should be on your screen now.','14:20')}
 ${lad('needs','Look at its window','Sign in too, if it asks.','')}
</ol></div>
<div class="panel mt"><div class="lbl">How does it look?</div>
 <div class="actions" style="margin-top:10px"><button class="btn primary" data-go="fix:1">It looks right</button><button class="btn secondary" data-go="fix:3">Blank here too</button><button class="btn quiet">Bring it to the front</button></div>
 <p class="note">If it looks right here, Ozone can draw and the problem is how it’s shown inside Bitwig. If it’s blank here too, the display mode is the next thing to try.</p></div>`},
{nav:'Plug-ins',q:'Is the choice yours, and do you understand each option well enough to pick?',html:`
${head('plugin','Display mode','Ozone 11','Choose how the manager draws Ozone’s window. Only Ozone changes.','')}
<div class="choices">
 <div class="choice"><i class="rd"></i><div><div class="top"><b>Standard</b><em class="tag dim">In use</em></div><span>The fastest way. Draws through Vulkan, the way Steam runs Windows games.</span><small>Blank window in Bitwig · 19 Oct</small></div></div>
 <div class="choice sel"><i class="rd"></i><div><div class="top"><b>Compatible</b><em class="tag">Suggested</em></div><span>An older, slower way of drawing that works with more plug-in windows.</span><small>Not tried yet</small></div></div>
</div>
<div class="panel mt"><div class="sw"><div><b>Windows accessibility support</b><span>On for most plug-ins. Turning it off can stop some windows hanging.</span></div><i class="tg on"></i></div></div>
<div class="actions"><button class="btn primary" data-go="fix:4">Use this and test</button><button class="btn secondary" data-go="fix:1">Back</button></div>`},
{nav:'Plug-ins',q:'Trying a fix: is it clear what changed and what you need to do?',html:`
${head('plugin','Plug-in','Ozone 11','iZotope · testing the Compatible display mode',chip('attention','Needs you','open the editor'))}

</ol></div>
<div class="panel mt"><div class="lbl">Did the editor appear?</div>
 <div class="actions" style="margin-top:10px"><button class="btn primary" data-go="fix:5">Yes, it looks right</button><button class="btn secondary" data-go="fix:1">Still blank</button><button class="btn secondary" data-go="fix:1">It appeared, then froze</button></div>
 <p class="note">If it doesn’t help, the manager switches Ozone back and moves on to the next fix.</p></div>`},

${head('plugin','Plug-in','Ozone 11','iZotope · VST3 effect · 11.0.3',chip('ready','Ready in your DAW'))}
<div class="cols w">
 <div class="panel"><div class="lbl">Is it ready?</div><ul class="ladder">
  ${lad('ok','Installed','In the iZotope setup','')}
  ${lad('ok','In your DAW’s folder','<span class="mono">~/.vst3/iZotope Ozone 11.vst3</span>','')}
  ${lad('ok','Sound','Processes audio in Bitwig Studio','19 Oct')}
  ${lad('ok','Editor window','Works with the Compatible display mode','20 Oct')}</ul></div>
 <div class="panel"><div class="lbl">Settings for Ozone</div><dl class="facts">
  <dt>Display mode</dt><dd>Compatible<small>Chosen by you on 20 Oct</small></dd></dl>
  <div class="actions" style="margin-top:14px"><button class="btn secondary" data-go="fix:3">Change</button></div>
  <p class="fine">With your permission, this fix is sent to us so Ozone works out of the box for the next person.</p></div>
</div>`}
]},
update:{name:'Update',steps:[

recover:{name:'Recover from a crash',steps:[
{nav:'Home',q:'When something breaks, do you know what happened, what’s safe and what to do, without Wine?',html:`
${head('plugin','Plug-in','Kontakt 8','Native Instruments · in Bitwig Studio',chip('problem','Stopped','Windows host'))}
<div class="panel"><div class="lbl">Signal path</div>${path(['ok','ok','bad','off'],['','cut','dim'],['still running','waiting','stopped','not loaded'])}</div>
<div class="alert"><h4>Kontakt 8 stopped responding.</h4>
 <p>Bitwig and your project are fine, and your other 5 plug-ins are unaffected. Restart Kontakt to carry on.</p>
 <div class="actions"><button class="btn primary" data-go="recover:1">Restart Kontakt 8</button><button class="btn secondary" data-go="recover:3">Make a support report</button></div>
 <details><summary>Technical details</summary><p class="mono">Windows host for Kontakt 8 (Native Instruments setup, runtime r7) exited at 14:31:07 with 0xC0000005 in Kontakt 8.dll. Kept for support reports.</p></details>

{nav:'Home',q:'Does restarting feel safe and quick?',html:`
${head('plugin','Plug-in','Kontakt 8','Native Instruments · in Bitwig Studio',chip('working','Restarting'))}

 ${lad('now','Loading Kontakt 8','','')}

</ol></div>
<p class="note">Bitwig keeps running. The track stays silent until Kontakt is back.</p>`},
{nav:'Home',q:'Is it obvious that everything is back to normal?',html:`
${head('plugin','Plug-in','Kontakt 8','Native Instruments · in Bitwig Studio',chip('ready','Playing again'))}
${livePath}
<div class="panel mt"><p style="margin:0;font-size:14px">Restarted at 14:32 in 4 seconds. If it stops again, a support report helps find the cause.</p>
<div class="actions" style="margin-top:12px"><button class="btn secondary" data-go="recover:3">Make a support report</button></div></div>`},
{nav:'Support',q:'Do you trust what’s in the report, and is sending it easy?',html:`
<div class="lbl">Support</div><div class="title">Make a support report</div>
<p class="lead" style="margin-bottom:14px">About Kontakt 8 stopping at 14:31. You can read everything before you send it.</p>
<div class="cols">
 <div class="panel"><div class="lbl">Included</div><ul class="chg">

const order=['install','ready','fix','update','recover','files'];
let cur={j:'install',s:0};
const $=id=>document.getElementById(id);
$('tabs').innerHTML=order.map((k,i)=>`<button class="tab" data-go="${k}:0"><b>${i+1}</b>${J[k].name}</button>`).join('');
function go(t){const [j,s]=t.split(':');cur={j,s:+s};render();}
function render(){
 const st=J[cur.j].steps[cur.s];
 $('body').innerHTML=st.html;$('body').scrollTop=0;
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.textContent===st.nav));
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.go.startsWith(cur.j+':')));
 $('q').innerHTML=`<b>Step ${cur.s+1} of ${J[cur.j].steps.length}.</b> ${st.q}`;
 const ji=order.indexOf(cur.j);
 $('back').disabled=cur.s===0&&ji===0;
 $('next').disabled=cur.s===J[cur.j].steps.length-1&&ji===order.length-1;
}
$('back').onclick=()=>{const ji=order.indexOf(cur.j);if(cur.s>0)cur.s--;else if(ji>0){cur.j=order[ji-1];cur.s=J[cur.j].steps.length-1}render();};
$('next').onclick=()=>{const ji=order.indexOf(cur.j);if(cur.s<J[cur.j].steps.length-1)cur.s++;else if(ji<order.length-1){cur.j=order[ji+1];cur.s=0}render();};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}const c=e.target.closest('.choice');if(c){c.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.toggle('sel',x===c));return;}const t=e.target.closest('.tg');if(t)t.classList.toggle('on');});
go(window.START||'fix:0');
</script>
