<!doctype html>
<!-- Throwaway: three arrangements of the agreed model, ?variant=A/B/C.
Question: which makes what I have, my next action, and return to music obvious?
Standalone because the native manager is paused and has no design authority. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Plugin Bridge — interaction prototype</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233347;background:#eef1f5;line-height:1.45;font-size:16px}*{box-sizing:border-box}body{margin:0;padding:18px 24px 95px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:26px;line-height:1.2}h2{font-size:23px;line-height:1.25}h3{font-size:17px}p{max-width:760px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;min-height:42px;padding:8px 14px;border:1px solid #bcc8d4;border-radius:7px;background:#fff}button:hover{background:#eff4fa}button:disabled{cursor:default;opacity:.5}button.primary{background:#274d75;border-color:#274d75;color:#fff}button.primary:hover{background:#1d3e60}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d99726;outline-offset:2px}select,input,textarea{max-width:100%;padding:9px;border:1px solid #bdc8d4;border-radius:5px;background:white}label{display:block;margin-bottom:14px}label span{display:block;font-weight:600;margin-bottom:5px}label.check{display:flex;align-items:center;gap:9px;margin:9px 0}label.check input{width:19px;height:19px}textarea{width:100%;min-height:82px}a{color:#24577f}.muted{color:#647286;font-size:14px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:#627187}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 4px}.tag{display:inline-block;border-radius:20px;padding:3px 9px;font-size:12px;background:#e7edf4;color:#45576b}.tag.good{background:#dceddf;color:#25523b}.tag.wait{background:#fff0cf;color:#76520d}.notice{border-left:4px solid #c18a25;background:#fff5de;padding:13px 16px;margin:12px 0}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid #dde3e9;padding-top:16px;margin:20px 0 16px}.facts dt{font-size:12px;color:#647286;margin-bottom:3px}.facts dd{margin:0;overflow-wrap:anywhere}.line{border-top:1px solid #dde3e9;padding:14px 0}details{margin:14px 0}summary{cursor:pointer;font-weight:600}.prototype{max-width:1320px;margin:0 auto 16px;border:2px dashed #7185a0;border-radius:10px;background:#e1e8f3;padding:12px 16px}.prototype .top{display:flex;justify-content:space-between;gap:12px;align-items:center}.prototype h1{font-size:18px;margin:0 0 3px}.prototype p{margin:0}.prototype-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}.prototype-controls label{margin:0}.prototype-controls select{padding:7px}.prototype button{min-height:36px;padding:5px 11px}.state{font-size:12px;color:#465972;margin-top:8px;overflow-wrap:anywhere}.state pre{white-space:pre-wrap;max-height:220px;overflow:auto}.app{max-width:1320px;margin:auto;background:#fff;border:1px solid #ced7e1;border-radius:13px;overflow:hidden;min-height:430px}.app-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 23px;border-bottom:1px solid #dbe2e9}.brand{font-size:18px;font-weight:750}.app-head nav{display:flex;gap:8px}.app-head button{min-height:36px;padding:5px 12px}.panel{padding:24px;min-width:0}.collection-layout{display:grid;grid-template-columns:285px minmax(0,1fr)}.collection{border-right:1px solid #dbe2e9;background:#f7f9fc;padding:22px 17px}.collection .item{display:block;width:100%;text-align:left;margin-top:9px;background:#fff;padding:13px}.item[aria-pressed=true]{border:2px solid #274d75;padding:12px}.item strong,.item small{display:block}.item small{color:#647286;margin:4px 0}.task-layout{padding:24px 32px}.task-title{display:flex;justify-content:space-between;align-items:center;gap:15px}.task-main{border-left:5px solid #315776;padding:18px 24px;background:#f5f8fc;margin:17px 0 25px}.task-layout table{border-collapse:collapse;width:100%;font-size:14px}.task-layout th{text-align:left;color:#637083;font-weight:500}.task-layout td,.task-layout th{border-bottom:1px solid #dde4eb;padding:10px 9px}.task-layout table button{min-height:34px;padding:4px 10px}.guided-layout{display:grid;grid-template-columns:185px minmax(0,1fr)}.goals{background:#21384f;color:#fff;padding:24px 16px}.goals p{color:#b9cadb}.goals button{width:100%;margin:6px 0;text-align:left;background:transparent;border-color:#627487;color:#fff}.goals button:hover{background:#304d68}.guided-work{padding:25px 32px;min-width:0}.journey{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 22px;font-size:13px}.journey span{border-bottom:3px solid #dbe3eb;padding:5px 8px;color:#758297}.journey span.current{border-color:#315c82;color:#1e4260;font-weight:700}.collection-strip{border-top:1px solid #dbe2e9;padding:13px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f7f9fc}.collection-strip button{min-height:34px;padding:5px 11px}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#182c43;color:white;border:2px solid #90a1b5;border-radius:50px;padding:7px 11px;box-shadow:0 4px 24px #12243b30;z-index:5;white-space:nowrap}.switcher button{background:#2d435c;border-color:#60768e;color:white;border-radius:30px;min-width:42px;min-height:38px}.switcher span{min-width:190px;text-align:center;font-size:14px}.vendor{background:#f2eaf9;border:1px solid #c4aed7;padding:18px;margin-top:18px}.vendor strong{color:#67417b}#announcement{max-width:1320px;margin:0 auto 12px;color:#3a5a72;font-size:14px}.empty{padding:25px 0}.two-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.help-policy{font-size:13px;border-top:1px solid #dbe2e9;margin-top:20px;padding-top:12px;color:#647286}@media(max-width:900px){body{padding:12px 12px 92px}.collection-layout{grid-template-columns:235px minmax(0,1fr)}.guided-layout{grid-template-columns:145px minmax(0,1fr)}.panel,.guided-work,.task-layout{padding:20px}.facts{grid-template-columns:1fr 1fr}.prototype .top{align-items:flex-start}.app-head{padding:14px}}@media(max-width:650px){.collection-layout,.guided-layout{grid-template-columns:1fr}.collection{border-right:0;border-bottom:1px solid #dbe2e9}.goals{padding:14px}.goals button{width:auto;margin-right:5px}.prototype .top,.app-head{flex-wrap:wrap}.facts,.two-fields{grid-template-columns:1fr}.switcher{gap:5px}.switcher span{min-width:165px}.task-layout table th:nth-child(2),.task-layout table td:nth-child(2){display:none}}
</style>
</head>
<body>
<section class="prototype" aria-label="Prototype controls, outside the product">
<div class="top"><div><h1>Throwaway interaction prototype</h1><p class="muted">Which arrangement makes what you have, your next action and returning to music obvious?</p></div><button id="offline">Save offline prototype</button></div>
<div class="prototype-controls"><label for="scenario">Try a situation</label><select id="scenario"><option value="reaper">First plug-in · REAPER</option><option value="asc">Add through existing Arturia Software Center</option><option value="kontakt">Kontakt already works · Bitwig</option></select><button id="reset">Reset situation</button><span class="muted">Simulated only. No installs, accounts, device changes or saved state. Reload resets.</span></div>
<div class="prototype-controls" id="events" aria-label="Simulated events"></div>
<div class="state" id="state"></div>
</section>
<p id="announcement" role="status" aria-live="polite"></p>
<main class="app" id="app" aria-label="Proposed product interface"></main>
<aside class="switcher" aria-label="Prototype variant switcher"><button id="previous" aria-label="Previous arrangement">←</button><span id="variant-label"></span><button id="next" aria-label="Next arrangement">→</button></aside>
<script>
const cleanHtml='<!doctype html>\n'+document.documentElement.outerHTML;
const variantNames={A:'Collection first',B:'Next action first',C:'Goal workspace'};
let variant=new URL(location.href).searchParams.get('variant')||document.documentElement.dataset.initialVariant||'A';
if(!variantNames[variant])variant='A';
let S,timers=[];
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,primary=false,disabled=false)=>`<button data-action="${action}" ${primary?'class="primary"':''} ${disabled?'disabled':''}>${label}</button>`;
const actions=(...items)=>`<div class="actions">${items.join('')}</div>`;
function reset(scenario){if(!['reaper','asc','kontakt'].includes(scenario))scenario='reaper';try{const url=new URL(location.href);url.searchParams.set('scenario',scenario);url.searchParams.set('variant',variant);history.replaceState({},'',url)}catch{}timers.forEach(clearTimeout);timers=[];const kontakt={id:'kontakt',name:'Kontakt 8',vendor:'Native Instruments',kind:'Instrument',available:true,library:'Music SSD',historyGap:true};const analog={id:'analog',name:'Analog Lab V',vendor:'Arturia',kind:'Instrument',available:true,library:'System drive'};S={scenario,daw:scenario==='reaper'?'REAPER':'Bitwig',products:scenario==='reaper'?[]:scenario==='asc'?[analog]:[kontakt,{id:'delay',name:'Example Delay',vendor:'Example vendor',kind:'Effect',available:true,library:'System drive'}],selected:scenario==='kontakt'?'kontakt':scenario==='asc'?'analog':null,view:'home',task:null,active:scenario==='asc',vendorWindow:false,libraryMissing:false,updated:false,useFailure:false,report:scenario==='kontakt'?'You reported playing Kontakt 8 and saving and reopening a Bitwig project.':'',notice:''};render()}
function pendingTask(){return S.task&&S.task.phase!=='ready'}
function nextActionTitle(){if(S.view==='music')return `Continue in ${S.daw}`;if(S.libraryMissing)return 'Reconnect the library drive';if(S.useFailure)return 'Restore the affected product setup';return pendingTask()?taskTitle():S.products.length?'Return to music':'Bring your software into use'}
function selected(){return S.products.find(p=>p.id===S.selected)||S.products[0]}
function targetName(){return S.scenario==='asc'?'Augmented STRINGS':'Example Synth'}
function productStatus(p){if(S.task&&['vendor','cancelling','automatic'].includes(S.task.phase)&&p.id==='analog')return ['Unavailable during vendor work','wait'];if(S.libraryMissing&&p.library==='Music SSD')return ['Library drive missing','wait'];if(S.useFailure&&p.id==='kontakt')return ['Problem in Bitwig','wait'];return p.available?[`Available to ${S.daw}`,'good']:['Installed · not selected','wait']}
function tag(p){const [text,color]=productStatus(p);return `<span class="tag ${color}">${esc(text)}</span>`}
function collectionItems(){return S.products.map(p=>`<button class="item" data-product="${p.id}" aria-pressed="${S.selected===p.id&&S.view==='detail'}"><strong>${esc(p.name)}</strong><small>${esc(p.vendor)} · ${p.kind}</small>${tag(p)}</button>`).join('')||'<div class="empty"><h3>No plug-ins added yet</h3><p class="muted">Add a managed installation to begin.</p></div>'}
function facts(){const p=selected();return `<dl class="facts"><div><dt>Your DAW</dt><dd>${S.daw}</dd></div><div><dt>Current work</dt><dd>${pendingTask()?esc(taskTitle()):'No task needs completing'}</dd></div><div><dt>Collection</dt><dd>${S.products.filter(p=>p.available).length} selected plug-in${S.products.filter(p=>p.available).length===1?'':'s'}</dd></div></dl>`}
function home(){if(S.libraryMissing||S.useFailure)return `<div class="eyebrow">One plug-in needs attention</div><h2>${S.libraryMissing?'Kontakt’s library drive is missing':'Kontakt has a problem in Bitwig'}</h2><p>${S.libraryMissing?'Reconnect the same unchanged Music SSD to restore library access.':'Actual use failed after the product update. A retained product setup is available to restore.'} Example Delay remains available independently.</p>${actions(button(S.libraryMissing?'Reconnect library drive':'Review restoration',S.libraryMissing?'reconnect':'restore',true),button('Use Example Delay','musicDelay'),button('Inspect Kontakt','detail'))}${facts()}`;if(S.task&&S.task.phase!=='ready')return `<h2>${esc(taskTitle())}</h2><p>${S.task.phase==='deferred'?'You deferred maintenance. Your existing plug-in remains available; resume when you are ready.':'Your original task is retained. Continue from its current step.'}</p>${actions(button('Continue this task','resume',true),button(`Return to ${S.daw}`,'music',false,!musicAllowed()))}${facts()}`;return `<div class="eyebrow">${S.products.length?'Ready when you are':'Start with your software'}</div><h2>${S.products.length?`You can make music in ${S.daw}`:'Add your first plug-in'}</h2><p>${S.products.length?'Nothing here needs marking complete. Open your DAW and use your available plug-ins; the manager can be closed.':'Choose an installer or vendor application. The product handles compatibility setup and makes chosen plug-ins available after the vendor work and required checks.'}</p>${actions(S.products.length?button(`Return to ${S.daw}`,'music',true):button('Add a plug-in','add',true),S.products.length?button('Add a plug-in','add'):'',button('Help','help'))}${facts()}${S.scenario==='asc'?'<p class="muted">Arturia Software Center is already managed here. Adding another product reuses that installation and vendor sign-in.</p>':''}${S.scenario==='kontakt'?'<p class="muted">Kontakt’s current access is valid. Your earlier use and recall are recorded as your report.</p>':''}`}
function taskTitle(){if(!S.task)return 'No current task';if(S.task.kind==='update')return 'Update product compatibility';if(S.task.kind==='restore')return 'Restore the previous product setup';return `Add ${S.task.names?.join(' and ')||targetName()}`}
function taskPanel(){const t=S.task;if(!t)return home();
if(t.kind==='update'||t.kind==='restore'){const restore=t.kind==='restore';return `<div class="eyebrow">Change a working setup</div><h2>${esc(taskTitle())}</h2><p>${restore?'Restore the retained product components and compatibility settings. Keep this exact Kontakt build, library and vendor installation.':'Apply the example product compatibility update to Kontakt 8. The current product setup is retained for restoration; this does not update the vendor plug-in.'}</p><div class="notice">Affected: Kontakt 8 in Bitwig. ${S.active?'Kontakt is active. Stop its instances in Bitwig before this change.':'No affected use is active in this simulated situation.'}<br>Restoration does not downgrade Kontakt, undo vendor changes or restore a licence.</div>${t.phase==='automatic'?'<p role="status">Applying and checking the selected product setup…</p>':actions(button(restore?'Restore product setup':'Apply product update',restore?'applyRestore':'applyUpdate',true,S.active),button('Defer change','deferChange'))}${facts()}`}
if(t.phase==='source')return `<div class="eyebrow">Add software · source</div><h2>What are you adding?</h2><p>${S.scenario==='asc'?'Use your existing managed Arturia Software Center. This keeps its current installation and vendor sign-in.':'Choose the installer you obtained from the vendor. The example file below is a simulated source, not a download.'}</p><label><span>Source</span><select id="source-choice"><option>${S.scenario==='asc'?'Existing Arturia Software Center · managed here':'Example Synth setup.exe · simulated installer'}</option></select></label><p class="muted">Beta manages installations made through this product. Existing external Wine/yabridge installations keep their owner; migration is later work.</p>${actions(button('Choose plug-ins and storage','sourceNext',true),button('Back to collection','cancelBeforeVendor'))}`;
if(t.phase==='choices')return `<div class="eyebrow">Add software · your choices</div><h2>Choose what becomes available</h2><p>These selections authorize automatic preparation and availability after vendor work finishes safely and required checks pass.</p><label class="check"><input id="chosen-main" type="checkbox" ${t.draftMain===false?'':'checked'}> ${esc(targetName())} · instrument</label><label class="check"><input id="chosen-other" type="checkbox" ${t.draftOther?'checked':''}> ${S.scenario==='asc'?'Mini V · instrument':'Example Reverb · effect'}</label><div class="two-fields"><label><span>Plug-in files</span><select id="files-drive"><option ${t.filesDrive!=='Music SSD'?'selected':''}>System drive</option><option ${t.filesDrive==='Music SSD'?'selected':''}>Music SSD</option></select></label><label><span>Library / content</span><select id="content-drive"><option ${t.contentDrive!=='System drive'?'selected':''}>Music SSD</option><option ${t.contentDrive==='System drive'?'selected':''}>System drive</option></select></label></div><p class="muted">Example storage: System drive 40 GB free · Music SSD 220 GB free. Selected example needs 8 GB plus 2 GB temporary space. The product checks access before writing.</p><p>Find these in <strong>${S.daw}</strong>. Other DAWs with access to the shared plug-in location may also see them.</p>${actions(button(S.scenario==='asc'?'Review effects on existing plug-ins':'Open vendor installer','choicesNext',true),button('Back','sourceBack'))}`;
if(t.phase==='consequence')return `<div class="eyebrow">Before vendor maintenance</div><h2>Analog Lab V shares this installation</h2><p>Adding ${esc(t.names.join(' and '))} through the existing Arturia Software Center may change files used by Analog Lab V. Its current installation and sign-in are retained.</p><div class="notice">${S.active?'Analog Lab V is active in Bitwig. Stop those instances in Bitwig, or defer this task and keep making music.':'Affected Analog Lab V use has stopped. You can continue into vendor maintenance.'}</div>${actions(button('Continue in Software Center','openVendor',true,S.active),button('Defer and keep current use','deferInstall'))}<p class="muted">While vendor work runs, affected plug-ins wait. Returning to music requires the vendor work to finish or stop safely.</p>`;
if(t.phase==='vendor'||t.phase==='cancelling')return `<div class="eyebrow">Vendor handoff</div><h2>${t.phase==='cancelling'?'Waiting for safe cancellation':'Continue in the vendor window'}</h2><p>${S.scenario==='asc'?'Arturia Software Center':'The Example Synth installer'} handles installation choices, downloads and any vendor authorization. The product waits for a safe return, then checks the selected plug-ins automatically.</p><div class="notice">${t.phase==='cancelling'?'Cancellation was requested. Vendor work may still be running; this has not undone its changes.':'Vendor work is ongoing. Closing its window alone does not make this task complete or safe for music.'}</div>${actions(button(S.vendorWindow?'Focus vendor window':'Show vendor window','vendorWindow',true),button('Request cancellation','requestCancel',false,t.phase==='cancelling'))}${S.vendorWindow?`<aside class="vendor"><strong>Simulated external vendor window</strong><p>${esc(t.names.join(' and '))} selected. Vendor-controlled installation and authorization happen here. This prototype collects no sign-in or licence information.</p><p class="muted">Use the separate prototype event controls above to simulate what the vendor actually does.</p></aside>`:'<p class="muted">Vendor window closed; owned vendor work is still ongoing.</p>'}`;
if(t.phase==='interrupted')return `<div class="eyebrow">Interrupted vendor work</div><h2>Resume the same installation</h2><p>The example vendor task stopped safely after cancellation. Partial download and completed work are retained. Vendor changes have not been rolled back.</p><p>${S.scenario==='asc'?'Analog Lab V’s current access was rechecked in this example and remains available. The same Arturia installation will be reused.':'Your selected source and storage remain part of this task.'}</p>${actions(button('Resume in vendor window','resumeVendor',true),button('Return to collection','home'))}`;
if(t.phase==='deferred')return home();
if(t.phase==='automatic')return `<div class="eyebrow">Product handles this</div><h2>Preparing your selected plug-ins</h2><p role="status">${esc(t.progress)}</p><p>No further publication approval or installation-completion checkbox is needed.</p>`;
return `<div class="eyebrow">Product-owned checks passed</div><h2>${esc(t.names.join(' and '))} available to ${S.daw}</h2><p>The selected plug-ins were discovered, checked and made accessible automatically. Find them in ${S.daw}; use its rescan only if they are missing.</p>${t.otherFound?`<p class="muted">${esc(t.otherFound)} was also discovered but was not selected for DAW use.</p>`:''}<p class="muted">DAW indexing, musical use and saved-project recall remain separate from these product checks.</p>${actions(button(`Return to ${S.daw}`,'music',true),button('See your collection','home'))}`;
}
function detail(){const p=selected();if(!p)return home();const [status]=productStatus(p);return `<div class="eyebrow">${esc(p.vendor)} · ${p.kind}</div><h2>${esc(p.name)}</h2>${tag(p)}${S.libraryMissing&&p.library==='Music SSD'?`<div class="notice">Music SSD is missing. This library is still bound to its original location. Reconnect the same unchanged drive; no files will be moved.</div>${actions(button('Reconnect library drive','reconnect',true))}`:S.useFailure&&p.id==='kontakt'?`<div class="notice">You reported a problem during actual Bitwig use after the product update. Preparation checks had passed; they did not establish successful music use.</div>${actions(button('Restore previous product setup','restore',true),button('Help','help'))}`:actions(button(`Return to ${S.daw}`,'music',true,!musicAllowed(p)),button('Add software','add'))}<dl class="facts"><div><dt>Current access</dt><dd>${esc(status)}</dd></div><div><dt>Library</dt><dd>${esc(p.library)}</dd></div><div><dt>Product setup</dt><dd>${S.updated&&p.id==='kontakt'?'Updated example configuration':'Current retained configuration'}</dd></div></dl>${p.historyGap?`<details><summary>Installation history</summary><p>An old installer result is missing. Current product-owned access is independently valid, so this is not an installation-completion task.</p></details>${actions(button('Review a Kontakt vendor update','vendorUpdate'),button('Review product compatibility update','update'))}`:''}${S.report&&p.id==='kontakt'?`<p class="muted"><strong>Your experience:</strong> ${esc(S.report)} This is attributed feedback, not an automated recall check.</p>`:''}<details><summary>Optional feedback / help</summary><p>Share your experience if useful. It does not change observed availability or supply missing installation history.</p><label><span>Your report</span><textarea id="report">${esc(S.reportDraft??S.report)}</textarea></label>${button('Record my report','report')}${button('Get help','help')}</details>`}
function musicAllowed(p=selected()){return !!p?.available&&!(S.libraryMissing&&p.library==='Music SSD')&&!(S.useFailure&&p.id==='kontakt')&&!(p.id==='analog'&&S.task&&['vendor','cancelling','automatic'].includes(S.task.phase))}
function workspace(){if(S.view==='task')return taskPanel();if(S.view==='detail')return detail();if(S.view==='help')return `<h2>Help with this task</h2><p>Use your existing private contact with the maintainer during beta. You can choose to export a small diagnostic summary and inspect it before sharing.</p><details open><summary>Optional export preview</summary><p>Only: plug-in names, chosen DAW, example product configuration and task stage. No vendor accounts, licences, presets, content or project files.</p></details>${actions(button('Download this optional summary','export'),button('Return to your situation','back',true))}<p class="help-policy">Beta covers managed installations and supported same-machine storage. External collection migration, full collection backup and transfer to another computer are later work. Vendor licensing stays with the vendor and you.</p>`;if(S.view==='gap')return `<h2>This Kontakt update needs missing information</h2><p>The historical installer result needed for this vendor-maintenance path is missing. This update cannot run yet through that path.</p><p>Kontakt’s current Bitwig access is independently valid. Your successful-use report cannot create missing installation history.</p>${actions(button('Keep using Kontakt in Bitwig','music',true),button('Help with this update','help'),button('Back to Kontakt','detail'))}`;if(S.view==='reconnect')return `<h2>Reconnect Music SSD</h2><p>Attach the same unchanged drive at its original location. The product will recheck access when it returns. It will not copy files or substitute another library.</p><div class="notice">Waiting for Music SSD. The unrelated Example Delay remains available.</div>${actions(button('Back to Kontakt','detail'),button('Help','help'))}`;if(S.view==='music')return `<div class="eyebrow">Return to your DAW</div><h2>Make music in ${S.daw}</h2><p>Find <strong>${esc(selected()?.name||S.task?.names?.[0]||'your available plug-in')}</strong> in ${S.daw} and add it to an ${selected()?.kind==='Effect'?'effect':'instrument'} track. The manager can be closed.</p><details><summary>If it is missing from ${S.daw}</summary><p>${S.daw==='REAPER'?'Open REAPER Preferences → Plug-ins → VST and rescan the existing VST3 paths.':'Open Bitwig Settings → Locations → Plug-ins and refresh its plug-in index.'} Product access does not prove that the DAW has indexed it.</p></details><p class="muted">This prototype opens no real DAW and does not observe playback or saved-project recall.</p>${actions(button('Back to collection','home'),button('Help','help'))}`;return home()}
function header(nav=true){return `<header class="app-head"><div><div class="brand">Linux Plugin Bridge</div><span class="muted">${S.daw} · managed collection</span></div>${nav?`<nav aria-label="Product navigation">${button('Collection','home')}${button('Add software','add')}${button('Help','help')}</nav>`:''}</header>`}
function VariantA(){return header()+`<div class="collection-layout"><aside class="collection"><h3>Your collection</h3>${collectionItems()}${pendingTask()?`<div class="line"><p class="muted">Current task</p>${button(esc(taskTitle()),'task')}</div>`:''}${S.scenario==='asc'?'<div class="line"><strong>Arturia Software Center</strong><p class="muted">Existing managed vendor application</p></div>':''}</aside><section class="panel">${workspace()}</section></div>`}
function VariantB(){return header(false)+`<section class="task-layout"><div class="task-title"><div><div class="eyebrow">Your next useful action</div><h3>${esc(nextActionTitle())}</h3></div>${actions(button('Add software','add'),button('Help','help'))}</div><div class="task-main">${workspace()}</div><h3>What you have</h3><table><thead><tr><th>Plug-in</th><th>Type / vendor</th><th>Current access</th><th></th></tr></thead><tbody>${S.products.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${p.kind} · ${esc(p.vendor)}</td><td>${tag(p)}</td><td><button data-product="${p.id}">Inspect</button></td></tr>`).join('')||'<tr><td colspan="4">No managed plug-ins yet.</td></tr>'}</tbody></table>${pendingTask()&&S.view!=='task'?actions(button('Continue current task','task')):''}</section>`}
function VariantC(){const phase=S.task?.phase;return header(false)+`<div class="guided-layout"><nav class="goals" aria-label="Your goal"><h3>What do you want?</h3><p class="muted">Start with your goal.</p>${button('Make music','music',false,!musicAllowed())}${button('Add software','add')}${button('Manage a plug-in','detail',false,!S.products.length)}${button('Get help','help')}</nav><section class="guided-work"><div class="journey" aria-label="Current journey"><span class="${S.task&&['source','choices','consequence','deferred','review'].includes(phase)?'current':''}">${S.task?'Your choice':'Your collection'}</span><span class="${['vendor','cancelling','interrupted','automatic'].includes(phase)?'current':''}">${S.task?'Work and return':'Current situation'}</span><span class="${phase==='ready'||S.view==='music'||!S.task&&musicAllowed()?'current':''}">Music</span></div>${workspace()}</section></div><footer class="collection-strip"><strong>Your collection</strong>${S.products.map(p=>`<button data-product="${p.id}">${esc(p.name)} · ${esc(productStatus(p)[0])}</button>`).join('')||'<span class="muted">Nothing added yet</span>'}${pendingTask()?button('Current task','task'):''}</footer>`}
function render(){document.getElementById('scenario').value=S.scenario;document.getElementById('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC})[variant]();document.getElementById('variant-label').textContent=`${variant} — ${variantNames[variant]}`;document.getElementById('announcement').textContent=S.notice;const phase=S.task?.phase;let events='';if(phase==='consequence'&&S.active||S.task&&['update','restore'].includes(S.task.kind)&&S.active)events+=button('Simulate affected DAW use stopped','event:stopUse');if(phase==='vendor')events+=button('Simulate vendor work finished safely','event:vendorDone')+button('Close vendor window only','event:closeWindow');if(phase==='cancelling')events+=button('Simulate cancellation finished safely','event:cancelDone');if(S.scenario==='kontakt'&&!S.libraryMissing)events+=button('Disconnect library drive','event:driveGone');if(S.libraryMissing)events+=button('Reconnect same unchanged drive','event:driveBack');if(S.updated&&!S.useFailure)events+=button('Simulate failure in actual Bitwig use','event:useFailure');document.getElementById('events').innerHTML=events?'<strong class="muted">Outside-product events:</strong>'+events:'<span class="muted">Event controls appear when a step needs an outside observation.</span>';document.getElementById('state').innerHTML=`<details><summary>Simulated facts · ${S.products.length} plug-ins · ${esc(phase||'no current task')} · ${esc(S.view)}</summary><pre>${esc(JSON.stringify(S,null,2))}</pre></details>`;document.title=`${variant} — ${variantNames[variant]} · LPB prototype`}
function beginAutomatic(kind){S.task.phase='automatic';S.task.progress='Discovering selected plug-ins…';render();timers.push(setTimeout(()=>{S.task.progress='Checking capabilities and preparing the selected configuration…';render()},400));timers.push(setTimeout(()=>{if(kind==='install'){const t=S.task;for(const name of t.names)S.products.push({id:name==='Augmented STRINGS'?'strings':name==='Example Synth'?'synth':name==='Mini V'?'mini':'reverb',name,vendor:S.scenario==='asc'?'Arturia':'Example vendor',kind:name==='Example Reverb'?'Effect':'Instrument',available:true,library:t.contentDrive,historyGap:false});S.selected=S.products.find(p=>p.name===t.names[0]).id;S.task.phase='ready';S.task.otherFound=[targetName(),S.scenario==='asc'?'Mini V':'Example Reverb'].filter(name=>!t.names.includes(name)).join(' and ');S.notice='Selected plug-ins became available automatically after safe vendor completion and required checks.'}else{const restoring=kind==='restore';S.updated=!restoring;S.useFailure=false;S.task=null;S.view='detail';S.notice=restoring?'Previous product setup restored and access rechecked. Try it in Bitwig; musical use has not been observed.':'Product update checks passed. Try it in Bitwig; restoration stays reachable if actual use fails.'}render()},1100))}
function captureDraft(){const main=document.getElementById('chosen-main');if(main&&S.task){S.task.draftMain=main.checked;S.task.draftOther=document.getElementById('chosen-other').checked;S.task.filesDrive=document.getElementById('files-drive').value;S.task.contentDrive=document.getElementById('content-drive').value}const report=document.getElementById('report');if(report)S.reportDraft=report.value}
function act(action){captureDraft();S.notice='';if(['update','restore'].includes(action)&&S.task&&S.task.phase!=='ready'){S.view='task';S.notice='Return to the retained task before starting another change.';render();return}if(action==='add'){if(S.task&&S.task.phase!=='ready'){S.view='task';S.notice='Continue the retained task before starting another.'}else{S.task={kind:'install',phase:'source'};S.view='task'}}else if(action==='sourceNext'){S.task.source=document.getElementById('source-choice').value;S.task.phase='choices'}else if(action==='choicesNext'){S.task.names=[];if(document.getElementById('chosen-main').checked)S.task.names.push(targetName());if(document.getElementById('chosen-other').checked)S.task.names.push(S.scenario==='asc'?'Mini V':'Example Reverb');if(!S.task.names.length){S.notice='Choose at least one plug-in to add.';render();return}S.task.filesDrive=document.getElementById('files-drive').value;S.task.contentDrive=document.getElementById('content-drive').value;S.task.phase=S.scenario==='asc'?'consequence':'vendor';S.vendorWindow=S.scenario!=='asc'}else if(action==='sourceBack')S.task.phase='source';else if(action==='openVendor'||action==='resumeVendor'){S.task.phase='vendor';S.view='task';S.vendorWindow=true}else if(action==='deferInstall'){S.task.phase='deferred';S.view='home'}else if(action==='resume'){if(S.task.phase==='deferred')S.task.phase='consequence';S.view='task'}else if(action==='vendorWindow')S.vendorWindow=true;else if(action==='requestCancel')S.task.phase='cancelling';else if(action==='cancelBeforeVendor'){S.task=null;S.view='home'}else if(action==='home')S.view='home';else if(action==='task')S.view='task';else if(action==='detail'){S.view='detail';S.selected=selected()?.id}else if(action==='musicDelay'){S.selected='delay';S.view='music'}else if(action==='music'){if(musicAllowed())S.view='music';else{S.view=S.libraryMissing?'reconnect':S.useFailure?'detail':'task';S.notice='Resolve the current affected capability before returning this plug-in to use.'}}else if(action==='help')S.view='help';else if(action==='back')S.view=S.task?'task':'detail';else if(action==='vendorUpdate')S.view='gap';else if(action==='reconnect')S.view='reconnect';else if(action==='update'||action==='restore'){S.task={kind:action,phase:'review'};S.view='task'}else if(action==='applyUpdate'||action==='applyRestore'){if(!S.active){beginAutomatic(action==='applyRestore'?'restore':'update');return}}else if(action==='deferChange'){S.task=null;S.view='detail'}else if(action==='report'){S.report=document.getElementById('report').value;S.notice='Your optional report is recorded in this prototype session. Observed facts and missing history are unchanged.'}else if(action==='export'){download('prototype-diagnostic-summary.txt',`PROTOTYPE — simulated diagnostic summary\nPlug-ins: ${S.products.map(p=>p.name).join(', ')}\nDAW: ${S.daw}\nProduct setup: ${S.updated?'updated example':'retained example'}\nTask stage: ${S.task?.phase||'none'}\n`,'text/plain');S.notice='Summary downloaded for your inspection. Nothing was sent to support.'}else if(action.startsWith('event:')){const event=action.slice(6);if(event==='stopUse')S.active=false;else if(event==='closeWindow')S.vendorWindow=false;else if(event==='vendorDone'){S.vendorWindow=false;beginAutomatic('install');return}else if(event==='cancelDone'){S.task.phase='interrupted';S.vendorWindow=false}else if(event==='driveGone'){S.libraryMissing=true;S.selected='kontakt';S.view='detail'}else if(event==='driveBack'){S.libraryMissing=false;S.view='detail';S.notice='Same unchanged drive returned at the original location. Access rechecked; no files moved.'}else if(event==='useFailure'){S.useFailure=true;S.active=true;S.selected='kontakt';S.view='detail'}}render()}
document.getElementById('app').addEventListener('click',event=>{const p=event.target.closest('[data-product]');if(p){S.selected=p.dataset.product;S.view='detail';S.notice='';render();return}const b=event.target.closest('[data-action]');if(b)act(b.dataset.action)});document.getElementById('events').addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(b)act(b.dataset.action)});
function switchVariant(direction){captureDraft();const keys=Object.keys(variantNames);variant=keys[(keys.indexOf(variant)+direction+keys.length)%keys.length];const url=new URL(location.href);url.searchParams.set('variant',variant);try{history.replaceState({},'',url)}catch{}render()}
document.getElementById('previous').addEventListener('click',()=>switchVariant(-1));document.getElementById('next').addEventListener('click',()=>switchVariant(1));document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchVariant(event.key==='ArrowLeft'?-1:1)}});document.getElementById('scenario').addEventListener('change',event=>reset(event.target.value));document.getElementById('reset').addEventListener('click',()=>reset(S.scenario));
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
document.getElementById('offline').addEventListener('click',()=>{const copy=new DOMParser().parseFromString(cleanHtml,'text/html');copy.documentElement.dataset.initialVariant=variant;copy.documentElement.dataset.initialScenario=S.scenario;download('linux-plugin-bridge-interaction-prototype.html','<!doctype html>\n'+copy.documentElement.outerHTML,'text/html;charset=utf-8')});reset(new URL(location.href).searchParams.get('scenario')||document.documentElement.dataset.initialScenario||'reaper');
</script>
</body>
