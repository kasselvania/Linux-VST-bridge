name: AP10 native result lifetime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ap10-native-results.yml'
      - 'CMakeLists.txt'
      - 'cmake/HP0*.cmake'
      - 'native-vst3-proxy/**'
      - 'native-audio-client/**'
      - 'vst-state/**'
      - 'tools/ap10-tests/**'
      - 'tools/ap11-tests/**'
      - 'windows-factory-probe/source/*.h'
permissions:
  contents: read
jobs:
  native-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install native build dependency
        run: |
          # These dependencies come from Ubuntu. An unrelated preinstalled
          # Chrome repository returned inconsistent signed index/package hashes.
          # Keep signature/hash verification and update only Ubuntu's sources.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y libx11-dev libxcb1-dev libxtst-dev xvfb
      - name: Acquire existing pinned official SDK
        run: python3 tools/wf0-factory-census/build.py acquire --sdk-root "${{ runner.temp }}/ap10-sdk"
      - name: Test production transport including first idle reply deadline
        run: |
          cargo test --manifest-path native-audio-client/Cargo.toml --locked admission
          cargo test --manifest-path native-vst3-proxy/backend/Cargo.toml --locked
      - name: Build Rust backend
        run: RUSTFLAGS="-C relocation-model=pic" cargo build --manifest-path native-vst3-proxy/backend/Cargo.toml --release --locked
      - name: Build production native processor and SDK regressions
        run: |
          cmake -S . -B "${{ runner.temp }}/ap10-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DAP2_BUILD_ONLY=ON -DAP10_RESULTS_TESTS=ON -DAP11_PANEL_TESTS=ON \
            -DVST3_SDK_ROOT="${{ runner.temp }}/ap10-sdk" \
            -DAP2_RUST_LIBRARY="$PWD/native-vst3-proxy/backend/target/release/libap2_backend.a" \
            -DAP8_DESCRIPTOR="$PWD/native-vst3-proxy/tests/result_lifetime/ap8_descriptor.h"
          cmake --build "${{ runner.temp }}/ap10-build" --target \
            ap10-result-lifetime ap10-results-tests ap11-native-tests ap11-state-tests ap11-panel-tests ap11-activation-tests ap3-callback-audit CommercialInstrumentBridge -j 4
      - name: Test shallow host lifetime and existing collector behavior
        run: ctest --test-dir "${{ runner.temp }}/ap10-build/native-vst3-proxy" --verbose
