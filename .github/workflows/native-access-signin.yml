name: Native Access browser return
# The sign-in return through the real handler, supervisor, launch adapter and
# a product-delivered Wine runtime, with a first-party stand-in app
# (bridge-manager/tests/native_access_signin). Pull requests run the
# recommended runtime; main runs every runtime a setup can be on.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bridge-manager/**'
      - 'crates/model/**'
      - 'tools/is2/**'
      - 'tools/naui2/package.py'
      - 'windows-fixtures/browser-return/**'
      - 'native-audio-client/**'
      - 'plugin-descriptor/**'
      - '.github/workflows/native-access-signin.yml'
  push:
    branches: [main]
    paths:
      - 'bridge-manager/**'
      - 'crates/model/**'
      - 'tools/is2/**'
      - 'tools/naui2/package.py'
      - 'windows-fixtures/browser-return/**'
      - 'native-audio-client/**'
      - 'plugin-descriptor/**'
      - '.github/workflows/native-access-signin.yml'
permissions:
  contents: read
jobs:
  browser-return:
    name: browser return on ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(github.ref == 'refs/heads/main' && '["r4","r5","r7"]' || '["r7"]') }}
    env:
      ARCHIVES: /var/tmp/lvb-runtime-archives
      FIXTURE: ${{ github.workspace }}/../browser-return
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Nothing here comes from Ubuntu's package mirrors, whose downloads
      # stalled this job for minutes at a time on some runners (2026-10-22/23).
      # The runner image already has the X server and the user session bus;
      # both Windows programs are built with the zig from PyPI below.
      - name: The runner's X server and session bus
        run: |
          dpkg-query -W -f='${Package} ${Version} ${db:Status-Abbrev}\n' xvfb dbus-user-session || true
          test -x /usr/bin/Xvfb ||
            { echo "::error title=Runner image::/usr/bin/Xvfb (package xvfb) is missing; the test needs an X server"; exit 1; }
          test -f /usr/lib/systemd/user/dbus.socket ||
            { echo "::error title=Runner image::/usr/lib/systemd/user/dbus.socket (package dbus-user-session) is missing; the test needs a user session bus"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select the disposable host interpreter at the product path
        run: |
          python -m pip install --quiet ziglang==0.14.1
          sudo ln -sfn "$(command -v python3)" /usr/bin/python3
          /usr/bin/python3 -I -B -c 'import sys; print(sys.version)'
      # The launch adapter through its recorded recipe (build_adapter in
      # tools/naui2/package.py), and the stand-in with the same zig: a GUI
      # program entered at wWinMain, as Native Access is.
      - name: Build the launch adapter and the stand-in app
        run: |
          mkdir -p "$FIXTURE"
          python - "$FIXTURE/adapter.exe" <<'PY'
          import pathlib, subprocess, sys, ziglang
          sys.path.insert(0, 'tools/naui2')
          import package
          try:
              package.build_adapter(pathlib.Path(ziglang.__file__).with_name('zig'), 'tools/is2/launch.cpp', sys.argv[1])
          except subprocess.CalledProcessError as error:
              sys.exit(error.stderr.decode(errors='replace'))
          PY
          python -m ziglang cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror \
            -municode -Wl,--subsystem,windows \
            -o "$FIXTURE/stand-in.exe" windows-fixtures/browser-return/single_instance_app.c \
            -lbcrypt -lws2_32 -lshell32
          sha256sum "$FIXTURE"/*.exe
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - name: Build the manager and the test
        run: cargo +1.95.0 test --release --locked --manifest-path bridge-manager/Cargo.toml --features runtime-revision-fixture --test native_access_signin --no-run
      - run: cargo +1.95.0 clippy --release --locked --manifest-path bridge-manager/Cargo.toml --features runtime-revision-fixture --test native_access_signin -- -D warnings
      # One cache for every runtime, keyed on the archives runtime_delivery.rs
      # declares. r7's set contains r4's and r5's, so only the r7 job saves it.
      - name: Name the declared runtime archives
        id: declared
        run: |
          digests=$(grep -oE 'sha256: ?"[0-9a-f]{64}"' bridge-manager/src/runtime_delivery.rs | grep -oE '[0-9a-f]{64}' | sort -u)
          test "$(echo "$digests" | wc -l)" -ge 5
          echo "key=lvb-runtime-archives-$(echo "$digests" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - name: Restore downloaded runtime archives
        id: archives
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/lvb-runtime-archives
          key: ${{ steps.declared.outputs.key }}
      # The runner account is disposable. Give it what a desktop login has:
      # its own systemd manager with a session bus, and an X server.
      - name: User session, display and a second account
        run: |
          mkdir -p "$ARCHIVES"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 120); do test -S /run/user/$uid/bus && test -S /run/user/$uid/systemd/private && break; sleep 0.5; done
          test -S /run/user/$uid/bus && test -S /run/user/$uid/systemd/private
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR=/run/user/$uid
          systemd-run --user --unit=lvb-test-display.service /usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
          systemctl --user set-environment DISPLAY=:99
          for _ in $(seq 1 60); do test -S /tmp/.X11-unix/X99 && break; sleep 0.5; done
          test -S /tmp/.X11-unix/X99
          sudo useradd --system --no-create-home lvb-other
      - name: Browser return on ${{ matrix.runtime }}
        timeout-minutes: 20
        env:
          LVB_DISPOSABLE_ACCOUNT: '1'
          LVB_SIGNIN_RUNTIME: managed-ge-proton11-7-slr4-20260805-${{ matrix.runtime }}
          LVB_SIGNIN_ARCHIVES: /var/tmp/lvb-runtime-archives
          LVB_SIGNIN_OTHER_USER: lvb-other
        run: |
          export LVB_SIGNIN_ADAPTER="$(realpath "$FIXTURE/adapter.exe")" LVB_SIGNIN_STAND_IN="$(realpath "$FIXTURE/stand-in.exe")"
          export LVB_SIGNIN_REPORT="$(realpath "$FIXTURE")/report.md"
          cargo +1.95.0 test --release --locked --manifest-path bridge-manager/Cargo.toml --features runtime-revision-fixture --test native_access_signin -- --nocapture
      - name: Timing
        if: always()
        run: test -f "$FIXTURE/report.md" && cat "$FIXTURE/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      # Records only, never a prefix or private capture; any fake code redacted.
      # The pattern avoids spelling the marker, which the test searches for.
      - name: Session records after a failure
        if: failure()
        run: |
          managed=~/.local/share/linux-vst-bridge/managed
          systemctl --user list-units --all 'linux-vst-bridge*' --no-pager || true
          for f in $(find "$managed/vendor-applications" -maxdepth 3 -name '*.json' -size -2M 2>/dev/null) \
                   $(find "$managed/environments" -path '*/drive_c/LVBStandIn/*' -size -1M 2>/dev/null); do
            echo "== ${f#$managed/}"; sed -E 's/lvbfake[c]ode[0-9a-f]*/<code>/g' "$f" | head -c 20000; echo
          done
          journalctl --user -b --no-pager -n 200 | sed -E 's/lvbfake[c]ode[0-9a-f]*/<code>/g' || true
      # Save only the complete declared set, every archive verified, so a
      # partial download is never kept under the shared key.
      - name: Check the downloaded runtime archives are complete
        id: complete
        if: always() && matrix.runtime == 'r7' && steps.archives.outputs.cache-hit != 'true'
        run: |
          test -d "$ARCHIVES" || { echo "complete=false" >> "$GITHUB_OUTPUT"; exit 0; }
          find "$ARCHIVES" -mindepth 1 -maxdepth 1 -name '.*' -delete
          complete=true
          for digest in $(grep -oE 'sha256: ?"[0-9a-f]{64}"' bridge-manager/src/runtime_delivery.rs | grep -oE '[0-9a-f]{64}' | sort -u); do
            if ! echo "$digest  $ARCHIVES/$digest" | sha256sum --check --status; then complete=false; echo "missing or changed: $digest"; fi
          done
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - name: Keep downloaded runtime archives
        if: always() && steps.complete.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: /var/tmp/lvb-runtime-archives
          key: ${{ steps.declared.outputs.key }}
