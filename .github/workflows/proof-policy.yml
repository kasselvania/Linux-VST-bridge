name: PX2 proof policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  proof-policy-core:
    name: PX2 proof policy core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile policy and transaction core
        run: >-
          python3 -m py_compile
          tools/classified_proof_backend.py
          tools/pc0_proof_adapter.py
          tools/pc0_diagnostic_worker.py
          tools/pc0_execution_worker.py
          tools/pc0_acceptance_worker.py
          tools/pc0_acceptance_adapter.py
          tools/pc0_contract.py
          tools/ap0_adapter.py
          tools/ap0_worker.py
          tools/ap0_worker_support.py
          tools/ap0_contract.py
          tools/test_ap0_contract.py
          tools/test_ap0_execution.py
          tools/test_pc0_acceptance.py
          tools/pc0_diagnostic_runtime.py
          tools/pc0_diagnostic_primitives.py
          tools/proof-run.py
          tools/proof_execution_policy.py
          tools/test_pc0_proof_adapter.py
          tools/test_classified_proof_backend.py
          tools/test_proof_execution_policy.py
          tools/test_proof_cli.py
          tools/test_pc0_diagnostic_runtime.py
      - name: Run deterministic policy and transaction tests
        run: >-
          python3 -m unittest -v
          tools/test_proof_execution_policy.py
          tools/test_classified_proof_backend.py
          tools/test_pc0_proof_adapter.py
          tools/test_proof_cli.py
          tools/test_pc0_diagnostic_runtime.py
          tools/test_pc0_acceptance.py
          tools/test_ap0_contract.py
          tools/test_ap0_execution.py
