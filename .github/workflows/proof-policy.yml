name: PX2 proof policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  proof-policy-core:
    name: PX2 proof policy core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile policy and transaction core
        run: >-
          python3 -m py_compile
          tools/classified_proof_backend.py
          tools/pc0_proof_adapter.py
          tools/pc0_diagnostic_worker.py
          tools/pc0_execution_worker.py
          tools/pc0_acceptance_worker.py
          tools/pc0_acceptance_adapter.py
          tools/pc0_contract.py
          tools/ap3_adapter.py
          tools/ap3_contract.py
          tools/ap3_worker_support.py
          tools/ap2_adapter.py
          tools/ap2_contract.py
          tools/ap2_native_artifact.py
          tools/ap2_worker_support.py
          tools/ap2_build_native.py
          tools/ap1_runtime.py
          tools/ap1_adapter.py
          tools/ap1_contract.py
          tools/ap1_worker_support.py
          tools/ap1_client_artifact.py
          tools/ap1_build_client.py
          tools/ap0_adapter.py
          tools/ap0_worker.py
          tools/ap0_worker_support.py
          tools/ap0_contract.py
          tools/test_ap0_contract.py
          tools/test_ap0_execution.py
          tools/test_pc0_acceptance.py
          tools/pc0_diagnostic_runtime.py
          tools/pc0_diagnostic_primitives.py
          tools/proof-run.py
          tools/proof_execution_policy.py
          tools/test_pc0_proof_adapter.py
          tools/test_classified_proof_backend.py
          tools/test_proof_execution_policy.py
          tools/test_proof_cli.py
          tools/test_pc0_diagnostic_runtime.py
      - name: Run deterministic policy and transaction tests
        run: >-
          python3 -m unittest -v
          tools/test_proof_execution_policy.py
          tools/test_classified_proof_backend.py
          tools/test_pc0_proof_adapter.py
          tools/test_proof_cli.py
          tools/test_pc0_diagnostic_runtime.py
          tools/test_pc0_acceptance.py
          tools/test_ap0_contract.py
          tools/test_ap0_execution.py
          tools/test_ap1_runtime.py
          tools/test_ap1_execution.py
          tools/test_ap1_client.py
          tools/test_ap2_execution.py
          tools/test_ap3_contract.py
          tools/test_ap3_execution.py
      - name: Check native codec and ownership
        run: |
          rustup run stable cargo fetch --manifest-path native-vst3-proxy/backend/Cargo.toml --locked
          RUSTC="$(rustup which --toolchain stable rustc)" rustup run stable cargo test --manifest-path native-audio-client/Cargo.toml --locked --offline
          RUSTC="$(rustup which --toolchain stable rustc)" rustup run stable cargo test --manifest-path native-vst3-proxy/backend/Cargo.toml --locked --offline
          c++ -std=c++20 -Wall -Wextra -Werror -I windows-factory-probe/source tools/ap1-tests/codec.cpp -o /tmp/ap1-codec-tests
          /tmp/ap1-codec-tests "$(cat tools/ap1-tests/golden.txt)"
      - name: Check private preview lifetime and cleanup
        run: |
          python3 tools/test_ap4_preview.py -v
          python3 tools/test_ap5_preview.py -v
          python3 tools/test_process_tracking.py -v
