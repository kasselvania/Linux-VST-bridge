name: Direct audio helper
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/direct-audio-handoff/**'
      - '.github/workflows/direct-audio-helper.yml'
permissions:
  contents: read
jobs:
  helper:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build original standalone adapter
        shell: pwsh
        run: |
          cmake -S tools/direct-audio-handoff -B "${{ runner.temp }}/direct-audio" -G "Visual Studio 17 2022" -A x64 -T v143
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "${{ runner.temp }}/direct-audio" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/direct-audio/Release/lvb-futex-probe.exe" --native-refusal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-audio-helper
          path: ${{ runner.temp }}/direct-audio/Release/lvb-futex-probe.exe
          if-no-files-found: error
          retention-days: 7
