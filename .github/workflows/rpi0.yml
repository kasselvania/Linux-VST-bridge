name: RPI0 deterministic qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rpi0/**'
      - 'windows-fixtures/rpi0/**'
      - 'native-vst3-proxy/backend/**'
      - 'native-audio-client/**'
      - 'windows-factory-probe/**'
      - 'CMakeLists.txt'
      - '.github/workflows/rpi0.yml'
permissions:
  contents: read
jobs:
  windows-x86-64:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Acquire pinned official VST3 SDK
        run: python tools/wf0-factory-census/build.py acquire --sdk-root "${{ runner.temp }}/rpi0-sdk"
      - name: Build and test source-owned x86-64 Windows instrument
        shell: pwsh
        run: |
          cmake -S . -B "${{ runner.temp }}/rpi0-windows" -G "Visual Studio 17 2022" -A x64 -T v143 "-DCMAKE_SYSTEM_VERSION=10.0.19041.0" -DWF0_BUILD_ONLY=ON "-DWF0_VST3_SDK_ROOT:PATH=${{ runner.temp }}/rpi0-sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "${{ runner.temp }}/rpi0-windows" --config Release --target wf0-factory-probe rpi0-arm-appliance-synth rpi0-windows-tests rpi0-windows-probe --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/rpi0-windows/rpi0/bin/Release/rpi0-windows-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/rpi0-windows/rpi0/bin/Release/rpi0-windows-probe.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install JACK development boundary
        run: sudo apt-get update && sudo apt-get install --yes libjack-jackd2-dev pkg-config gcc-x86-64-linux-gnu
      - name: Build and test native AArch64 appliance
        run: |
          cargo test --manifest-path rpi0/standalone/Cargo.toml --locked
          cmake -S . -B "${{ runner.temp }}/rpi0-arm" -DRPI0_ARM_BUILD_ONLY=ON
          cmake --build "${{ runner.temp }}/rpi0-arm" --parallel 2
          "${{ runner.temp }}/rpi0-arm/rpi0-layout-assertions"
          "${{ runner.temp }}/rpi0-arm/rpi0-core-tests"
          x86_64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror -static rpi0/preflight/linux_probe.c -o "${{ runner.temp }}/rpi0-x86-64-linux-probe"
          x86_64-linux-gnu-readelf -h "${{ runner.temp }}/rpi0-x86-64-linux-probe" | grep --extended-regexp 'Class:[[:space:]]+ELF64'
          x86_64-linux-gnu-readelf -h "${{ runner.temp }}/rpi0-x86-64-linux-probe" | grep --extended-regexp 'Machine:[[:space:]]+Advanced Micro Devices X86-64'
  existing-x86-64-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve existing x86-64 Rust plane
        run: |
          cargo test --manifest-path native-audio-client/Cargo.toml --locked
          cargo test --manifest-path native-vst3-proxy/backend/Cargo.toml --locked
