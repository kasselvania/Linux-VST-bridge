name: AP8 Windows host
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ap8-windows.yml'
      - 'windows-factory-probe/**'
      - 'vst-state/**'
permissions:
  contents: read
jobs:
  host:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Acquire pinned official SDK
        run: python tools/wf0-factory-census/build.py acquire --sdk-root "${{ runner.temp }}/ap8-sdk"
      - name: Build existing Windows host
        shell: pwsh
        run: |
          cmake -S . -B "${{ runner.temp }}/ap8-build" -G "Visual Studio 17 2022" -A x64 -T v143 "-DCMAKE_SYSTEM_VERSION=10.0.19041.0" -DWF0_BUILD_ONLY=ON "-DWF0_VST3_SDK_ROOT=${{ runner.temp }}/ap8-sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "${{ runner.temp }}/ap8-build" --config Release --target wf0-factory-probe wf0-loader-adapter-tests --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_ap4_socket.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Out-File -Encoding ascii "${{ runner.temp }}/ap8-build/wf0/bin/Release/SOURCE_COMMIT.txt"
          Get-FileHash "${{ runner.temp }}/ap8-build/wf0/bin/Release/*.exe" -Algorithm SHA256 | Format-List | Out-File -Encoding ascii "${{ runner.temp }}/ap8-build/wf0/bin/Release/SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ap8-windows-host-${{ github.sha }}
          path: ${{ runner.temp }}/ap8-build/wf0/bin/Release/
          if-no-files-found: error
