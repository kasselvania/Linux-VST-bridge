name: AP8 Windows host
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ap8-windows.yml'
      - 'windows-factory-probe/**'
      - 'vst-state/**'
      - 'windows-fixtures/ap10/**'
      - 'native-vst3-proxy/include/ap10*'
      - 'native-vst3-proxy/source/output_results.h'
      - 'tools/ap10-tests/**'
      - 'tools/ap11-tests/**'
      - 'tools/ap12-tests/**'
      - 'tools/ap13-tests/**'
      - 'tools/ap14-tests/**'
      - 'tools/ap18-tests/**'
      - 'tools/uio1/**'
      - 'native-vst3-proxy/include/ap11*'
      - 'native-vst3-proxy/include/ap18_bus_support.h'
permissions:
  contents: read
jobs:
  host:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Acquire pinned official SDK
        run: python tools/wf0-factory-census/build.py acquire --sdk-root "${{ runner.temp }}/ap8-sdk"
      - name: Build existing Windows host
        shell: pwsh
        run: |
          cmake -S . -B "${{ runner.temp }}/ap8-build" -G "Visual Studio 17 2022" -A x64 -T v143 "-DCMAKE_SYSTEM_VERSION=10.0.19041.0" -DWF0_BUILD_ONLY=ON "-DWF0_VST3_SDK_ROOT:PATH=${{ runner.temp }}/ap8-sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "${{ runner.temp }}/ap8-build" --config Release --target wf0-factory-probe wf0-loader-adapter-tests ap10-return-fixture ap10-results-tests ap11-editor-tests ap11-state-tests ap12-path-tests ap12-fault-tests ap13-state-delivery-tests ap14-environment-tests ap18-result-custody-tests ap18-bus-census-tests ap18-lc1-session uio1-tests --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/ap10-results-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/ap11-editor-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/ap11-state-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/ap12-path-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/ap18-bus-census-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/ap18-result-custody-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/ap12-fault-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/ap13-state-delivery-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/ap14-environment-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/ap8-build/wf0/bin/Release/uio1-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Out-File -Encoding ascii "${{ runner.temp }}/ap8-build/wf0/bin/Release/SOURCE_COMMIT.txt"
          Get-FileHash "${{ runner.temp }}/ap8-build/wf0/bin/Release/*.exe" -Algorithm SHA256 | Format-List | Out-File -Encoding ascii "${{ runner.temp }}/ap8-build/wf0/bin/Release/SHA256.txt"
      - name: Test socket idle and disconnect behavior
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -winsdk=10.0.19041.0
          if errorlevel 1 exit /b %errorlevel%
          python tools/test_delivery_trace.py
          if errorlevel 1 exit /b %errorlevel%
          python tools/test_delivery_mailbox.py
          if errorlevel 1 exit /b %errorlevel%
          python tools/test_ap4_socket.py
          if errorlevel 1 exit /b %errorlevel%
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ap8-windows-host-${{ github.sha }}
          path: ${{ runner.temp }}/ap8-build/wf0/bin/Release/
          if-no-files-found: error
