name: Recovered runtime source inputs

on:
  pull_request:
    paths:
      - 'tools/runtime-dcomp/**'
      - 'tools/runtime/**'
      - 'tools/runtime-uia-guard/**'
      - 'tools/runtime-msi-reader/**'
      - '.github/workflows/runtime-source-inputs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-source-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check exact source patches and historical launcher derivation
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          recipe = json.loads(Path('tools/runtime-dcomp/recipe.json').read_bytes())
          source = Path(os.environ['RUNNER_TEMP']) / 'runtime-wine-inputs'
          for patch in recipe['patches']:
              # Only two pinned LGPL source files, never a runtime or vendor payload.
              relative = patch['source']
              url = ('https://raw.githubusercontent.com/giang17/wine/'
                     + recipe['wine']['commit'] + '/' + relative)
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = response.read(2 * 1024 * 1024 + 1)
              if len(data) > 2 * 1024 * 1024:
                  raise ValueError('Wine source file exceeds the check bound')
              target = source / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          subprocess.run(['python3', 'tools/runtime-dcomp/check.py',
                          '--wine-source', str(source)], check=True)
      - name: Check combined common Wine source inputs
        run: python3 tools/runtime/prepare.py --check-upstream
      - name: Check complete Proton build inputs and generated prefix
        run: python3 tools/runtime/redist-inputs.py --check-upstream
      - name: Check deterministic common build identity
        run: python3 tools/runtime/test_build_identity.py

  mechanism-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build original Win32 regression fixtures in both architectures
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
          mkdir "$RUNNER_TEMP/runtime-mechanism-fixtures"
          for arch in i686 x86_64; do
            compiler="$arch-w64-mingw32-gcc"
            output="$RUNNER_TEMP/runtime-mechanism-fixtures"
            "$compiler" -municode -static -Wall -Wextra -Werror \
              tools/runtime-msi-reader/strref_fixture.c -o "$output/strref-$arch.exe" -lmsi -lole32
            "$compiler" -municode -static -Wall -Wextra -Werror \
              tools/runtime/dcomp_fixture.c -o "$output/dcomp-$arch.exe" -lole32
            "$compiler" -municode -static -Wall -Wextra -Werror \
              tools/runtime/loader_fixture.c -o "$output/loader-$arch.exe"
          done
          python3 tools/runtime/build-regression-fixtures.py \
            --output "$RUNNER_TEMP/runtime-mechanism-fixtures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-mechanism-fixtures
          path: ${{ runner.temp }}/runtime-mechanism-fixtures/*.exe
          if-no-files-found: error
          retention-days: 3
