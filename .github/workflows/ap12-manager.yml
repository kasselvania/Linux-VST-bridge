name: AP12 registered owner
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/is3/**'
      - 'tools/is4/**'
      - 'tools/naui1/**'
      - 'tools/naui2/**'
      - 'tools/nad1/**'
      - 'evidence/nad1/**'
      - 'evidence/naui1/**'
      - 'tools/mf2/**'
      - 'tools/mf3/**'
      - 'tools/lc2/**'
      - 'evidence/lc2/generated.json'
      - 'bridge-manager/**'
      - 'native-audio-client/**'
      - 'compatibility/**'
      - '.github/workflows/ap12-manager.yml'
      - 'tools/ap8_descriptor.py'
      - 'tools/test_ap10_descriptor.py'
      - 'tools/frg1/**'
      - 'evidence/frg1/**'
      - 'tools/uio1/**'
      - 'tools/uir1/**'
      - 'tools/uio2/**'
      - 'tools/uio3/**'
      - 'tools/uir2/**'
      - 'tools/if2/**'
      - 'tools/ca1/**'
      - 'manager-ui/**'
      - 'tools/mf1/**'
permissions:
  contents: read
jobs:
  wd1-linux-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 build --release --manifest-path bridge-manager/Cargo.toml --locked --bin linux-vst-bridge
      - run: cargo +1.95.0 build --release --manifest-path manager-ui/Cargo.toml --locked --bin linux-audio-compatibility-manager
      - name: Bind exact source and executable identities
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          files = {
              'linux-vst-bridge': pathlib.Path('bridge-manager/target/release/linux-vst-bridge'),
              'linux-audio-compatibility-manager': pathlib.Path('manager-ui/target/release/linux-audio-compatibility-manager'),
          }
          package = pathlib.Path('wd1-linux-artifacts')
          package.mkdir()
          identities = {}
          for name, path in files.items():
              data = path.read_bytes()
              (package / name).write_bytes(data)
              identities[name] = hashlib.sha256(data).hexdigest()
          manifest = {
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'sha256': identities,
          }
          (package / 'manifest.json').write_text(json.dumps(manifest, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wd1-linux-artifacts
          path: wd1-linux-artifacts/
          if-no-files-found: error
          retention-days: 7
  operator-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - run: cargo +1.95.0 test --manifest-path manager-ui/Cargo.toml --locked
      - run: cargo +1.95.0 clippy --manifest-path manager-ui/Cargo.toml --locked --all-targets -- -D warnings
  manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo test --manifest-path bridge-manager/Cargo.toml --locked
      - run: cargo test --manifest-path bridge-manager/Cargo.toml --example uir1_report --locked
      - run: cargo clippy --manifest-path bridge-manager/Cargo.toml --locked --all-targets -- -D warnings
      - run: python3 -m unittest discover -s bridge-manager/runtime -v
      - run: python3 tools/test_ap10_descriptor.py
      - run: python3 tools/frg1/test_census.py
      - run: python3 -m unittest discover -s tools/mf3 -v
      - run: python3 -m unittest discover -s tools/lc2 -v
      - run: python3 -m unittest discover -s tools/is3 -v
      - run: python3 -m unittest discover -s tools/is4 -v
      - run: python3 -m unittest discover -s tools/naui1 -v
      - run: python3 -m unittest discover -s tools/naui2 -v
      - run: python3 -m unittest discover -s tools/nad1 -v
      - run: python3 -m unittest discover -s tools/uio1 -v
      - run: python3 -m unittest discover -s tools/uir1 -v
      - run: python3 -m unittest discover -s tools/uio2 -v
      - run: python3 -m unittest discover -s tools/uio3 -v
      - run: python3 -m unittest discover -s tools/uir2 -v
      - run: python3 -m unittest discover -s tools/if2 -v
      - run: sudo apt-get install -y xvfb libxtst6 libxcomposite1 libxi6
      - run: UIO1_XVFB_FIXTURE=1 timeout 20s xvfb-run -a python3 tools/uio1/x11_fixture.py
      - run: UIO2_XVFB_FIXTURE=1 timeout 20s xvfb-run -a python3 tools/uio2/x11_fixture.py
      - run: UIO3_XVFB_FIXTURE=1 timeout 20s xvfb-run -a python3 tools/uio3/x11_fixture.py
      - run: UIR2_X11_FIXTURE=1 timeout 20s xvfb-run -a python3 tools/uir2/xclock_fixture.py
