name: AP12 registered owner
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/is3/**'
      - 'tools/is4/**'
      - 'tools/naui1/**'
      - 'tools/naui2/**'
      - 'tools/nad1/**'
      - 'evidence/nad1/**'
      - 'evidence/naui1/**'
      - 'tools/mf2/**'
      - 'tools/mf3/**'
      - 'tools/beta/**'
      - 'tools/lc2/**'
      - 'evidence/lc2/generated.json'
      - 'bridge-manager/**'
      - 'crates/model/**'
      - 'crates/service/**'
      - 'crates/cli/**'
      - 'crates/view-model/**'
      - 'crates/client/**'
      # Read by problem.rs's explanation-completeness test.
      - 'windows-factory-probe/source/inspect_module.cpp'
      - 'windows-factory-probe/source/ap8_state.h'
      - 'windows-factory-probe/source/stereo_negotiation.h'
      - 'native-audio-client/**'
      - 'plugin-descriptor/**'
      - 'compatibility/**'
      - '.github/workflows/ap12-manager.yml'
      - '.github/scripts/apt-install.sh'
      - 'tools/ap8_descriptor.py'
      - 'tools/test_ap10_descriptor.py'
      - 'tools/frg1/**'
      - 'evidence/frg1/**'
      - 'tools/uio1/**'
      - 'tools/uir1/**'
      - 'tools/uio2/**'
      - 'tools/uio3/**'
      - 'tools/uir2/**'
      - 'tools/if2/**'
      - 'tools/ca1/**'
      - 'manager-ui/**'
      - 'tools/mf1/**'
      - 'tools/pkg0/**'
  # Merges to main run the same checks, so main is verified after it moves.
  push:
    branches: [main]
    paths:
      - 'tools/is3/**'
      - 'tools/is4/**'
      - 'tools/naui1/**'
      - 'tools/naui2/**'
      - 'tools/nad1/**'
      - 'evidence/nad1/**'
      - 'evidence/naui1/**'
      - 'tools/mf2/**'
      - 'tools/mf3/**'
      - 'tools/beta/**'
      - 'tools/lc2/**'
      - 'evidence/lc2/generated.json'
      - 'bridge-manager/**'
      - 'crates/model/**'
      - 'crates/service/**'
      - 'crates/cli/**'
      - 'crates/view-model/**'
      - 'crates/client/**'
      # Read by problem.rs's explanation-completeness test.
      - 'windows-factory-probe/source/inspect_module.cpp'
      - 'windows-factory-probe/source/ap8_state.h'
      - 'windows-factory-probe/source/stereo_negotiation.h'
      - 'native-audio-client/**'
      - 'plugin-descriptor/**'
      - 'compatibility/**'
      - '.github/workflows/ap12-manager.yml'
      - '.github/scripts/apt-install.sh'
      - 'tools/ap8_descriptor.py'
      - 'tools/test_ap10_descriptor.py'
      - 'tools/frg1/**'
      - 'evidence/frg1/**'
      - 'tools/uio1/**'
      - 'tools/uir1/**'
      - 'tools/uio2/**'
      - 'tools/uio3/**'
      - 'tools/uir2/**'
      - 'tools/if2/**'
      - 'tools/ca1/**'
      - 'manager-ui/**'
      - 'tools/mf1/**'
      - 'tools/pkg0/**'
permissions:
  contents: read
jobs:
  wd1-linux-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 build --release --manifest-path crates/cli/Cargo.toml --locked --bin linux-vst-bridge
      - run: cargo +1.95.0 build --release --manifest-path manager-ui/Cargo.toml --locked --bin linux-audio-compatibility-manager
      - name: Bind exact source and executable identities
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          files = {
              'linux-vst-bridge': pathlib.Path('crates/cli/target/release/linux-vst-bridge'),
              'linux-audio-compatibility-manager': pathlib.Path('manager-ui/target/release/linux-audio-compatibility-manager'),
          }
          package = pathlib.Path('wd1-linux-artifacts')
          package.mkdir()
          identities = {}
          for name, path in files.items():
              data = path.read_bytes()
              (package / name).write_bytes(data)
              identities[name] = hashlib.sha256(data).hexdigest()
          manifest = {
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'sha256': identities,
          }
          (package / 'manifest.json').write_text(json.dumps(manifest, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wd1-linux-artifacts
          path: wd1-linux-artifacts/
          if-no-files-found: error
          retention-days: 7
  operator-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - run: cargo +1.95.0 test --manifest-path manager-ui/Cargo.toml --locked
      - run: cargo +1.95.0 clippy --manifest-path manager-ui/Cargo.toml --locked --all-targets -- -D warnings
      # Shared request/custody behavior moved out of the frontend; dependency
      # tests are not run by cargo test on the frontend itself.
      - run: cargo +1.95.0 test --manifest-path crates/client/Cargo.toml --locked --all-features
      - run: cargo +1.95.0 clippy --manifest-path crates/client/Cargo.toml --locked --all-targets --all-features -- -D warnings
      # The window's screen model, built on its own with nothing but the wire model.
      - run: cargo +1.95.0 test --manifest-path crates/view-model/Cargo.toml --locked
      - run: cargo +1.95.0 clippy --manifest-path crates/view-model/Cargo.toml --locked --all-targets --all-features -- -D warnings
      # The window's own build carries none of the view model's sample states;
      # only its tests and previews (dev-dependencies) turn them on.
      - name: The window builds the view model without its samples
        run: |
          tree=$(cargo +1.95.0 tree --manifest-path manager-ui/Cargo.toml --locked -e normal,features -i lvb-view-model)
          echo "$tree"
          grep -q '^lvb-view-model v' <<<"$tree"
          if grep -q 'feature "samples"' <<<"$tree"; then
            echo "::error::The window's build enables lvb-view-model's samples feature"
            exit 1
          fi
  manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every minor the source supervisor declares (supervisor.rs SOURCE_PYTHON_RANGE).
        python: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # All but bsdtar (libarchive-tools) are already on the runner image.
      - name: System packages
        timeout-minutes: 9
        run: bash .github/scripts/apt-install.sh xvfb libxtst6 libxcomposite1 libxi6 libarchive-tools gnupg
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Select the disposable host interpreter at the product path
        run: |
          sudo ln -sfn "$(command -v python3)" /usr/bin/python3
          /usr/bin/python3 -I -B -c 'import sys; print(sys.version); print(sys.executable)'
      - name: Provide the per-user runtime directory for the service's memory transport
        run: |
          runtime="/run/user/$(id -u)"
          test -d "$runtime" || sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$runtime"
          stat -f -c %T "$runtime"
      # The real `serve` on a fixture state, driven through the operator CLI
      # and the service socket (crates/cli/tests/real_service). The full
      # suite below runs it again with everything else.
      - name: Real-service behaviour oracle
        run: cargo test --manifest-path crates/cli/Cargo.toml --locked --features service-executor-fixture --test real_service
      - run: cargo test --manifest-path crates/cli/Cargo.toml --locked
      - run: cargo test --manifest-path crates/service/Cargo.toml --locked
      - name: Bounded configuration timing observation
        run: cargo test --manifest-path crates/service/Cargo.toml --locked --features pb0-c0-audit audit_
      - run: cargo test --manifest-path crates/service/Cargo.toml --example uir1_report --locked
      - run: cargo test --manifest-path crates/model/Cargo.toml --locked
      - run: cargo clippy --manifest-path crates/model/Cargo.toml --locked --all-targets -- -D warnings
      # Until one workspace lockfile replaces them, each crate's own lockfile
      # must pin every crate it shares with the manager's and the window's
      # exactly as they do.
      - name: Crate, manager and window lockfiles agree
        run: |
          python3 - <<'PY'
          import sys, tomllib
          def entries(path):
              with open(path, 'rb') as lock:
                  return {(p['name'], p['version'], p.get('checksum'))
                          for p in tomllib.load(lock)['package']}
          failed = False
          for crate in ('crates/model', 'crates/view-model'):
              own = entries(f'{crate}/Cargo.lock')
              for user in ('crates/service', 'crates/cli', 'crates/client', 'manager-ui', 'crates/window'):
                  theirs = entries(f'{user}/Cargo.lock')
                  names = {name for name, _, _ in theirs}
                  drift = sorted((e for e in own if e[0] in names and e not in theirs), key=str)
                  for name, version, checksum in drift:
                      pinned = sorted(f'{v} {c}' for n, v, c in theirs if n == name)
                      print(f'{name}: {crate} has {version} {checksum}; {user} has {pinned}')
                  failed = failed or bool(drift)
          sys.exit(1 if failed else 0)
          PY
      - run: cargo clippy --manifest-path crates/cli/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo clippy --manifest-path crates/service/Cargo.toml --locked --all-targets -- -D warnings
      - run: python3 -m unittest discover -s bridge-manager/runtime -v
      - run: python3 tools/test_ap10_descriptor.py
      - run: python3 tools/frg1/test_census.py
      - run: python3 -m unittest discover -s tools/mf3 -v
      - run: python3 -m unittest discover -s tools/beta -v
      - run: python3 -m unittest discover -s tools/lc2 -v
      - run: python3 -m unittest discover -s tools/is3 -v
      - run: python3 -m unittest discover -s tools/is4 -v
      - run: python3 -m unittest discover -s tools/naui1 -v
      - run: python3 -m unittest discover -s tools/naui2 -v
      - run: python3 -m unittest discover -s tools/nad1 -v
      - run: python3 -m unittest discover -s tools/uio1 -v
      - run: python3 -m unittest discover -s tools/uir1 -v
      - run: python3 -m unittest discover -s tools/uio2 -v
      - run: python3 -m unittest discover -s tools/uio3 -v
      - run: python3 -m unittest discover -s tools/uir2 -v
      - run: python3 -m unittest discover -s tools/if2 -v
      # The signing verifier rebuilds offline using the backend's own lockfile,
      # whose transitive versions need not match the manager dependency cache.
      - run: cargo fetch --manifest-path native-vst3-proxy/backend/Cargo.toml --locked --target x86_64-unknown-linux-gnu
      - run: python3 -m unittest discover -s tools/pkg0 -v
      - run: python3 tools/pkg0/root_intake_fixture.py
      - run: UIO1_XVFB_FIXTURE=1 timeout 20s xvfb-run -a python3 tools/uio1/x11_fixture.py
      - run: UIO2_XVFB_FIXTURE=1 timeout 20s xvfb-run -a python3 tools/uio2/x11_fixture.py
      - run: UIO3_XVFB_FIXTURE=1 timeout 20s xvfb-run -a python3 tools/uio3/x11_fixture.py
      - run: UIR2_X11_FIXTURE=1 timeout 20s xvfb-run -a python3 tools/uir2/xclock_fixture.py
