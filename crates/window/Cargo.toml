[package]
name = "lvb-window"
version = "0.1.0"
edition = "2021"
description = "Bridge native window and product presentation"
publish = false

# Independent lockfile keeps service-only builds independent of the private toolkit.
[workspace]

[[bin]]
name = "linux-audio-compatibility-manager"
path = "src/main.rs"
required-features = ["live"]

[[bin]]
name = "bridge-window-preview"
path = "src/preview_main.rs"
required-features = ["samples"]

[features]
default = ["live"]
samples = ["lvb-view-model/samples"]
live = ["dep:lvb-client", "dep:lvb-model", "lvb-client/native-dialogs"]

[dependencies]
makepad-widgets = { git = "https://github.com/kasselvania/makepad.git", rev = "8025a1f9e3702aada20f83beee00e79ab17c09e4" }
makepad-product-ui = { git = "https://github.com/kasselvania/makepad.git", rev = "8025a1f9e3702aada20f83beee00e79ab17c09e4" }
lvb-view-model = { path = "../view-model" }
lvb-client = { path = "../client", optional = true }
lvb-model = { path = "../model", optional = true }
serde_json = "=1.0.150"

# Preserve the toolkit's own patches at exactly the same private revision.
[patch.crates-io]
bitflags = { git = "https://github.com/kasselvania/makepad.git", rev = "8025a1f9e3702aada20f83beee00e79ab17c09e4" }
smallvec = { git = "https://github.com/kasselvania/makepad.git", rev = "8025a1f9e3702aada20f83beee00e79ab17c09e4" }
windows-link = { git = "https://github.com/kasselvania/makepad.git", rev = "8025a1f9e3702aada20f83beee00e79ab17c09e4" }
