[package]
name = "lvb-client"
version = "0.1.0"
edition = "2021"
[features]
# The native dialog implementation is separate from request and custody logic.
native-dialogs = ["dep:rfd"]
[dependencies]
lvb-model = { path = "../model" }
lvb-view-model = { path = "../view-model" }
serde_json = "=1.0.150"
[target.'cfg(target_os = "linux")'.dependencies]
# Retained filesystem/artifact/catalogue helpers; no manager policy is copied.
linux-vst-bridge = { path = "../../bridge-manager" }
libc = "=0.2.189"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
