[package]
name = "lvb-service"
version = "0.12.0"
edition = "2021"
[features]
service-executor-fixture = []
# Opt-in binary-test fixture; release builds refuse it in frg1.rs.
cpi2-test-contract = []
# Private, bounded manager readback/configuration timing observation; excluded
# from normal packages and independent of installed product qualification.
pb0-c0-audit = []
# Test fixture only: lets the browser-return test acquire every declared
# runtime revision through the product's delivery code. Never in packages.
runtime-revision-fixture = []
[dependencies]
lvb-plugin-descriptor = { path = "../../plugin-descriptor" }
lvb-model = { path = "../model" }
ap1-native-client = { path = "../../native-audio-client" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
libc = "=0.2.189"
sha1 = "=0.10.6"
tar = "=0.4.46"
flate2 = "=1.1.10"
xz2 = { version = "=0.1.7", features = ["static"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }

# Needs a disposable account, a user systemd manager and a downloaded Wine
# runtime; see the test's own documentation and .github/workflows.

[lib]
# Existing public helper imports retain their spelling during owner extraction.
name = "linux_vst_bridge"
