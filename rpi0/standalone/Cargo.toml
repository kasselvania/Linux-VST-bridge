[package]
name = "lvb-arm-standalone"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
jack-runtime = []
rpi1-observe = ["ap2-backend/rpi1-observe"]

[dependencies]
ap2-backend = { path = "../../native-vst3-proxy/backend", features = ["rpi0"] }
sha2 = "=0.10.9"
libc = "=0.2.189"

[profile.release]
panic = "abort"
strip = true
lto = "thin"
codegen-units = 1
