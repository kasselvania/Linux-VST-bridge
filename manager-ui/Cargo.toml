[package]
name = "linux-audio-compatibility-manager"
version = "0.1.0"
edition = "2021"
default-run = "linux-audio-compatibility-manager"
[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

lvb-client = { path = "../crates/client", features = ["native-dialogs"] }
libc = "=0.2.189"
linux-vst-bridge = { package = "lvb-service", path = "../crates/service" }
lvb-view-model = { path = "../crates/view-model" }

[dev-dependencies]
lvb-client = { path = "../crates/client", features = ["samples"] }
png = "=0.18.1"
# Previews and the render digests draw the named sample states.
lvb-view-model = { path = "../crates/view-model", features = ["samples"] }
