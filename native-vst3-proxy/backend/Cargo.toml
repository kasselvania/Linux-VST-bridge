[package]
name = "ap2-backend"
version = "0.1.0"
edition = "2021"
[features]
registered = []
rpi0 = []
# Local SDK/transport regression only; never combine with a product build.
recovery-integration = []
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
lvb-plugin-descriptor = { path = "../../plugin-descriptor" }
ap1-native-client = { path = "../../native-audio-client" }
sha2 = "=0.10.9"
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
[[example]]
name = "recovery-integration-smoke"
required-features = ["recovery-integration"]

[profile.release]
panic = "unwind"
