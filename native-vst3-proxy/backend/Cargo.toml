[package]
name = "ap2-backend"
version = "0.1.0"
edition = "2021"
[features]
registered = []
rpi0 = []
rpi2-quantum = ["rpi0", "ap1-native-client/rpi2-quantum"]
rpi1-observe = ["rpi0"]
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
ap1-native-client = { path = "../../native-audio-client" }
sha2 = "=0.10.9"
[profile.release]
panic = "unwind"
