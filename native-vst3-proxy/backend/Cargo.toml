[package]
name = "ap2-backend"
version = "0.1.0"
edition = "2021"
[features]
registered = []
rpi0 = []
private-state-authoring = []

[[bin]]
name = "lvb-private-state-bind"
path = "src/bin/private_state_bind.rs"
required-features = ["private-state-authoring"]
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
ap1-native-client = { path = "../../native-audio-client" }
sha2 = "=0.10.9"
libc = "=0.2.189"
[profile.release]
panic = "unwind"
