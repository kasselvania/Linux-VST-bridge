[package]
name = "linux-vst-bridge"
version = "0.12.0"
edition = "2021"
[features]
# Opt-in binary-test fixture; release builds refuse it in frg1.rs.
cpi2-test-contract = []
# Source-owned, non-product read-only convergence probe. Never included in a
# normal manager/frontend package generation.
pb0-r3-audit = []
pb0-c0-audit = []
[dependencies]
ap1-native-client = { path = "../native-audio-client" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
libc = "=0.2.189"
sha1 = "=0.10.6"
tar = "=0.4.46"
flate2 = "=1.1.10"
xz2 = { version = "=0.1.7", features = ["static"] }
